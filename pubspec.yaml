name: icare
description: "iCare Virtual Hospital — Your complete healthcare platform."
publish_to: 'none'

version: 1.0.2+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  intro_slider: ^4.2.5
  path: ^1.9.1
  flutter_svg: ^2.2.1
  agora_rtc_engine: 6.5.3
  # Zego removed: calls run on Jitsi now and no Dart file imports zego_*,
  # but the packages still shipped ~7MB of web assets (copyrighted-music.js,
  # ZegoExpressWebFlutterWrapper.js, voice-changer.js, zim/index.js) that
  # every page load had to fetch.
  flutter_size_matters: ^1.0.8
  flutter_riverpod: ^3.0.3
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  dotted_border: ^3.1.0
  flutter_switch: ^0.3.2
  uuid: ^4.5.2
  flutter_chat_ui: ^2.9.1
  flutter_chat_types: ^3.6.2
  simple_numpad: ^1.0.5
  flutter_smart_dialog: ^4.9.8+9
  easy_date_timeline: ^2.0.9
  flutter_rating_bar: ^4.0.1
  flutter_steps: ^1.0.5
  dio: ^5.9.0
  responsive_framework: ^1.5.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.0
  file_picker: ^10.3.8
  url_launcher: ^6.3.2
  google_sign_in: ^6.1.6
  fl_chart: ^0.70.2
  speech_to_text: ^7.0.0
  easy_localization: ^3.0.7
  go_router: ^14.6.1
  pdf: ^3.11.1
  printing: ^5.13.4
  web: ^1.1.0
  local_auth: ^2.3.0
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.13.2
  image: ^4.2.0
  qr_flutter: ^4.1.0
  sign_in_with_apple: ^8.1.0
  video_player: ^2.9.2
  path_provider: ^2.1.4
  open_file: ^3.5.7
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    # assets/images/screenshots/ removed: 5MB of documentation screenshots
    # that no Dart file references, but which every user downloaded because
    # declaring the directory bundles it whole. The files stay in the repo
    # for docs — they just no longer ship in the app.
    - assets/images/splash_web_bg.png
    - assets/images/web_splash.jpeg
    - assets/translations/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Light.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 400
