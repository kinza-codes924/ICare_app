name: iCare Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - wajahat

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wajahat

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Backup files
        run: |
          cp android/app/google-services.json /tmp/google-services.json

      - name: Delete entire android folder
        run: rm -rf android

      - name: Regenerate android folder
        run: flutter create --platforms android .

      - name: Remove conflicting .kts files
        run: |
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts

      - name: Restore google-services.json
        run: cp /tmp/google-services.json android/app/google-services.json

      # Nayi Groovy files pehle write hongi taake Gradle ko project mil jaye
      - name: Write settings.gradle (Groovy, AGP 8.7.0)
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.7.0" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
              id "com.google.gms.google-services" version "4.4.4" apply false
          }
          include ":app"
          EOF

      - name: Write app/build.gradle (Groovy, Firebase)
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }
          android {
              namespace "com.example.icare"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }
              defaultConfig {
                  applicationId "com.example.icare"
                  minSdk flutter.minSdkVersion
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          flutter {
              source "../.."
          }
          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
              implementation platform("com.google.firebase:firebase-bom:34.0.0")
              implementation "com.google.firebase:firebase-messaging"
          }
          EOF

      - name: Write android/build.gradle
        run: |
          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Write gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdkWarning=true
          EOF

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      # MOVED HERE: Ab jab settings.gradle ban chuki hai, wrapper safely update ho jayega
      - name: Upgrade Gradle Wrapper
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.10 --distribution-type all

      - name: Verify no .kts conflict
        run: |
          echo "--- Gradle files present ---"
          find android -name "*.gradle*" | sort
          echo "----------------------------"

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCare-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
