name: Build Flutter APK

on:
  push:
    branches: [ "wajahat" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wajahat branch
        uses: actions/checkout@v4
        with:
          ref: wajahat
          submodules: false

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch jcenter() and add namespace in pub-cache packages
        run: |
          set +e
          for f in $(find $HOME/.pub-cache -name "build.gradle" 2>/dev/null); do
            grep -q "jcenter()" "$f" 2>/dev/null && sed -i 's/jcenter()/maven { url "https:\/\/jcenter.bintray.com" }/g' "$f"
            if grep -q "com.android.library" "$f" 2>/dev/null && ! grep -q "namespace" "$f" 2>/dev/null; then
              MANIFEST=$(find "$(dirname "$f")" -name "AndroidManifest.xml" 2>/dev/null | head -1)
              if [ -f "$MANIFEST" ]; then
                PKG=$(grep -o 'package="[^"]*"' "$MANIFEST" 2>/dev/null | head -1 | sed 's/package="//;s/"//')
                test -n "$PKG" && sed -i "/android {/a\\    namespace \"$PKG\"" "$f"
              fi
            fi
          done
          set -e
          echo "Patching complete"

      - name: Backup google-services.json
        run: cp android/app/google-services.json /tmp/google-services.json

      - name: Regenerate android folder fresh
        run: |
          rm -rf android
          flutter create --platforms android .

      - name: Restore google-services.json
        run: cp /tmp/google-services.json android/app/google-services.json

      - name: Fix duplicate Flutter plugin (settings.gradle.kts already loads it)
        run: |
          # Remove dev.flutter.flutter-gradle-plugin from build.gradle.kts
          # It's already loaded via settings.gradle.kts flutter-plugin-loader
          sed -i '/dev.flutter.flutter-gradle-plugin/d' android/app/build.gradle.kts

      - name: Add Firebase to app build.gradle.kts
        run: |
          # Add google-services plugin
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          # Add coreLibraryDesugaring and Firebase dependencies
          cat >> android/app/build.gradle.kts << 'EOF'

          // Firebase
          val googleServicesVersion = "4.4.4"

          dependencies.add("coreLibraryDesugaring", "com.android.tools:desugar_jdk_libs:2.1.4")
          dependencies.add("implementation", platform("com.google.firebase:firebase-bom:34.0.0"))
          dependencies.add("implementation", "com.google.firebase:firebase-messaging")
          EOF

      - name: Add google-services classpath to android build files
        run: |
          # Enable desugaring in compileOptions
          sed -i '/isCoreLibraryDesugaringEnabled/d' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCare-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
