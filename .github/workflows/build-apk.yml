name: Build Flutter APK

on:
  push:
    branches: [ "wajahat" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wajahat branch
        uses: actions/checkout@v4
        with:
          ref: wajahat
          submodules: false

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch jcenter() in pub-cache (Gradle 9 fix)
        run: |
          set +e
          for f in $(find $HOME/.pub-cache -name "build.gradle" 2>/dev/null); do
            grep -q "jcenter()" "$f" 2>/dev/null && \
              sed -i 's/jcenter()/maven { url "https:\/\/jcenter.bintray.com" }/g' "$f"
          done
          set -e

      - name: Backup google-services.json
        run: cp android/app/google-services.json /tmp/google-services.json

      - name: Regenerate android folder (clean Flutter 3.44 structure)
        run: |
          rm -rf android
          flutter create --platforms android .

      - name: Restore google-services.json
        run: cp /tmp/google-services.json android/app/google-services.json

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Add google-services plugin to settings.gradle.kts
        run: |
          # Add google-services to the plugins block in settings.gradle.kts
          if ! grep -q "google-services" android/settings.gradle.kts; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/&\n    id("com.google.gms.google-services") version "4.4.4" apply false/' android/settings.gradle.kts
          fi

      - name: Add google-services plugin to app build.gradle.kts
        run: |
          if ! grep -q "google-services" android/app/build.gradle.kts; then
            sed -i 's/id("kotlin-android")/id("kotlin-android")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
          fi

      - name: Add Firebase dependencies to app build.gradle.kts
        run: |
          # Find and add to existing dependencies block
          python3 - << 'PYEOF'
          import re

          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()

          firebase_deps = '''    implementation(platform("com.google.firebase:firebase-bom:34.0.0"))
              implementation("com.google.firebase:firebase-messaging")'''

          # Add before closing brace of dependencies block
          if 'firebase-bom' not in content:
              content = re.sub(r'(dependencies \{)', r'\1\n' + firebase_deps, content)

          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)

          print("Firebase deps added")
          PYEOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCare-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
