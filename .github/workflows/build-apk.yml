name: Build Flutter APK

on:
  push:
    branches: [ "wajahat" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wajahat branch
        uses: actions/checkout@v4
        with:
          ref: wajahat
          submodules: false

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch jcenter() in pub-cache (Gradle 9 fix)
        run: |
          find $HOME/.pub-cache -name "build.gradle" | while read f; do
            if grep -q "jcenter()" "$f" 2>/dev/null; then
              sed -i 's/jcenter()/maven { url "https:\/\/jcenter.bintray.com" }/g' "$f"
            fi
          done
          find $HOME/.pub-cache -name "build.gradle" | while read f; do
            if grep -q "com.android.library" "$f" 2>/dev/null && ! grep -q "namespace" "$f" 2>/dev/null; then
              MANIFEST=$(find "$(dirname "$f")" -name "AndroidManifest.xml" 2>/dev/null | head -1)
              if [ -f "$MANIFEST" ]; then
                PKG=$(grep -o 'package="[^"]*"' "$MANIFEST" 2>/dev/null | head -1 | sed 's/package="//;s/"//')
                if [ -n "$PKG" ]; then
                  sed -i "/android {/a\\    namespace \"$PKG\"" "$f"
                fi
              fi
            fi
          done

      - name: Use main branch android folder (known working)
        run: |
          git fetch origin main
          git checkout origin/main -- android/

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCare-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
