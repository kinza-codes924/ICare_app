<!doctype html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iCare - Your Virtual Healthcare Platform">
  <meta name="google-signin-client_id" content="1076307742101-avj49igc93qipdcnqbqsk3u14gdcb2oh.apps.googleusercontent.com">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iCare">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: data: blob:; img-src 'self' data: https: http: blob:; frame-src 'self' https://vh.itserver.biz https://icare-backend-inky.vercel.app https://docs.google.com https://www.youtube.com https://youtube.com https://player.vimeo.com https://www.google.com https://recaptcha.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://vh.itserver.biz https://cdn.jsdelivr.net https://www.gstatic.com https://accounts.google.com https://www.google.com https://www.recaptcha.net; connect-src 'self' https: http: wss: data: blob:; worker-src 'self' blob: https://www.gstatic.com;">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>iCare</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #ffffff; }
    /* Show native browser scrollbar on Flutter web's glass pane */
    flt-glass-pane { overflow-y: auto !important; }
    flt-glass-pane::-webkit-scrollbar { width: 8px; }
    flt-glass-pane::-webkit-scrollbar-track { background: #f1f5f9; }
    flt-glass-pane::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    flt-glass-pane::-webkit-scrollbar-thumb:hover { background: #64748b; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; z-index: 9999;
    }
    #loading img { width: 160px; height: 160px; object-fit: contain; }
    #loading .spinner {
      margin-top: 24px; width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #0036BC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icare_logo.png" alt="iCare" style="width:160px;height:160px;object-fit:contain;">
    <div class="spinner"></div>
  </div>
  <!-- share_plus plugin looks for this element; hidden so old cached share-modal.js never throws -->
  <div id="share-modal" style="display:none"></div>
  <script>
    // Clear any stale retry counter from old deployments
    sessionStorage.removeItem('_icare_retry');

    function _hideLoading() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }
    window.addEventListener('flutter-first-frame', _hideLoading);
    // Fallback timeout hides the spinner after 8 seconds.
    setTimeout(_hideLoading, 8000);

    // ── Raise Flutter glass pane above platform views (Jitsi iframe) ────────
    window.raiseFlutterLayer = function() {
      document.querySelectorAll('flt-glass-pane,flt-text-editing-host').forEach(function(el) {
        el.style.zIndex = '99999';
      });
    };

    // ── Jitsi Meet helpers — Doctor/Patient Consultation (self-hosted Jitsi) ──
    var _JITSI_DOMAIN = 'vh.itserver.biz';
    var _jitsiRemoteJoined = false;
    var _jitsiRemoteLeft = false;
    var _jitsiClosed = false;
    var _jitsiApi = null;

    // Full button set — used by LMS live sessions
    var _JITSI_TOOLBAR_BUTTONS = [
      'microphone', 'camera', 'desktop', 'embedmeeting',
      'fullscreen', 'fodeviceselection', 'hangup', 'profile', 'chat', 'polls',
      'recording', 'etherpad', 'shareaudio',
      'settings', 'raisehand', 'videoquality', 'filmstrip',
      'stats', 'shortcuts', 'tileview', 'videobackgroundblur',
      'download', 'help', 'mute-everyone', 'security', 'toggle-camera',
      'select-background', 'noise-suppression', 'whiteboard'
    ];

    // Stripped-down button set for doctor/patient consultations
    // (no screen share, tile view, raise hand, recording, whiteboard, stats,
    //  shortcuts, shared video/audio, select-background, toggle-camera)
    // 'polls' IS included here even though the consultation flow doesn't use
    // polls — icare-custom.js repurposes the Polls tab itself into "File
    // Upload" for consultations, so the tab must exist for that hijack to work.
    var _CONSULTATION_TOOLBAR_BUTTONS = [
      'microphone', 'camera', 'fullscreen', 'fodeviceselection',
      'hangup', 'chat', 'polls', 'settings', 'videoquality', 'filmstrip',
      'noise-suppression', 'help'
    ];

    var _JITSI_INTERFACE_OVERWRITE = {
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      SHOW_POWERED_BY: false,
      DISABLE_VIDEO_BACKGROUND: false,
      HIDE_DEEP_LINKING_LOGO: true,
      MOBILE_APP_PROMO: false,
    };

    // Consultation interface config — hides moderator/profile/shortcuts/general settings tabs
    var _CONSULTATION_INTERFACE_OVERWRITE = {
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      SHOW_POWERED_BY: false,
      DISABLE_VIDEO_BACKGROUND: false,
      HIDE_DEEP_LINKING_LOGO: true,
      MOBILE_APP_PROMO: false,
      SETTINGS_SECTIONS: ['devices', 'language', 'sounds'],
    };

    // Globals for consultation file upload
    var _consultAuthToken = null;
    var _consultChatChannel = null;
    var _consultSenderName = null;
    var _consultSubject = null;
    var _consultFilePoller = null;
    var _consultFileCursor = 0;

    // Globals for LMS live-session file upload (mirrors the consultation
    // ones above — lmsJitsiJoin never set any of this, so files picked in
    // the LMS "File Upload" panel had nowhere to go: the shared listener at
    // the bottom always hit the "missing auth/channel" branch and silently
    // dropped them, which is why they vanished right after the local
    // "✓ Shared" confirmation).
    var _lmsAuthToken = null;
    var _lmsChatChannel = null;
    var _lmsSenderName = null;
    var _lmsFilePoller = null;
    var _lmsFileCursor = 0;
    var _lmsIsInstructor = false;

    // Flutter web's shared_preferences JSON-encodes stored strings, so the
    // raw localStorage value is the token WRAPPED IN LITERAL DOUBLE QUOTES
    // ("eyJ..."). Sending that as `Authorization: Bearer "eyJ..."` fails
    // auth (401) on every call-chat request — which is exactly why LMS file
    // uploads (which rely on this fallback; consultations get the token
    // passed explicitly from Dart) were accepted locally but never saved.
    function _lsToken() {
      var t = localStorage.getItem('flutter.token');
      return t ? t.replace(/^"|"$/g, '') : null;
    }

    // Push a message INTO the Jitsi iframe (icare-custom.js listens on the other side)
    function _postToJitsi(msg) {
      try {
        if (!_jitsiApi) return;
        var ifr = _jitsiApi.getIFrame();
        if (ifr && ifr.contentWindow) {
          ifr.contentWindow.postMessage(msg, 'https://' + _JITSI_DOMAIN);
        }
      } catch(_) {}
    }

    // Poll the call-chat API and forward file messages (img:/doc: payloads)
    // into the Jitsi iframe so both parties see shared files in the
    // "File Upload" tab.  Also re-pushes the per-user consultation title so
    // icare-custom.js can override the subject text even if it loads late.
    function _startConsultFilePoller() {
      _stopConsultFilePoller();
      _consultFileCursor = 0;
      _consultFilePoller = setInterval(function() {
        if (!_jitsiApi) return;
        if (_consultSubject) _postToJitsi({ type: 'icare-subject', text: _consultSubject });
        // Re-sent every tick, not just once at join — icare-custom.js loads
        // asynchronously inside the iframe, so a single postMessage right
        // after iframe creation can arrive before its listener exists and be
        // silently dropped (exactly what happened: _mode never got set).
        _postToJitsi({ type: 'icare-context', mode: 'consultation' });
        var token = _consultAuthToken || _lsToken();
        if (!token || !_consultChatChannel) return;
        fetch('https://icare-backend-inky.vercel.app/api/call-chat/messages/'
              + encodeURIComponent(_consultChatChannel) + '?since=' + _consultFileCursor, {
          headers: { 'Authorization': 'Bearer ' + token },
        }).then(function(r) { return r.json(); })
          .then(function(j) {
            var msgs = (j && j.messages) || [];
            if (!msgs.length) return;
            var files = [];
            msgs.forEach(function(m) {
              var t = (m.text || '') + '';
              var ts = Date.parse(m.createdAt || '') || 0;
              if (ts > _consultFileCursor) _consultFileCursor = ts;
              if (t.indexOf('img:') === 0 || t.indexOf('doc:') === 0) {
                files.push({ sender: m.sender || 'User', text: t, ts: ts });
              }
            });
            if (files.length) _postToJitsi({ type: 'icare-file-list', files: files });
          }).catch(function(){});
      }, 4000);
    }

    function _stopConsultFilePoller() {
      if (_consultFilePoller) { clearInterval(_consultFilePoller); _consultFilePoller = null; }
    }

    // Push a message into the LMS Jitsi iframe (separate instance from the
    // consultation one — _lmsJitsiApi, not _jitsiApi).
    function _postToJitsiLms(msg) {
      try {
        if (!_lmsJitsiApi) return;
        var ifr = _lmsJitsiApi.getIFrame();
        if (ifr && ifr.contentWindow) {
          ifr.contentWindow.postMessage(msg, 'https://' + _JITSI_DOMAIN);
        }
      } catch(_) {}
    }

    // Same call-chat polling/relay as the consultation flow, keyed by the
    // LMS room name instead of a consultation channel — call-chat is a
    // generic channelName-keyed store, not consultation-specific.
    function _startLmsFilePoller() {
      _stopLmsFilePoller();
      _lmsFileCursor = 0;
      _lmsFilePoller = setInterval(function() {
        if (!_lmsJitsiApi) return;
        // Re-sent every tick — see the matching comment in
        // _startConsultFilePoller for why a single send-on-join isn't enough.
        _postToJitsiLms({ type: 'icare-context', mode: 'lms', isInstructor: _lmsIsInstructor });
        var token = _lmsAuthToken || _lsToken();
        if (!token || !_lmsChatChannel) return;
        fetch('https://icare-backend-inky.vercel.app/api/call-chat/messages/'
              + encodeURIComponent(_lmsChatChannel) + '?since=' + _lmsFileCursor, {
          headers: { 'Authorization': 'Bearer ' + token },
        }).then(function(r) { return r.json(); })
          .then(function(j) {
            var msgs = (j && j.messages) || [];
            console.log('[iCare lms-poll] channel=', _lmsChatChannel, 'since=', _lmsFileCursor, 'gotMessages=', msgs.length);
            if (!msgs.length) return;
            var files = [];
            msgs.forEach(function(m) {
              var t = (m.text || '') + '';
              var ts = Date.parse(m.createdAt || '') || 0;
              if (ts > _lmsFileCursor) _lmsFileCursor = ts;
              if (t.indexOf('img:') === 0 || t.indexOf('doc:') === 0) {
                files.push({ sender: m.sender || 'User', text: t, ts: ts });
              }
            });
            console.log('[iCare lms-poll] matched file messages=', files.length);
            if (files.length) _postToJitsiLms({ type: 'icare-file-list', files: files });
          }).catch(function(){});
      }, 4000);
    }

    function _stopLmsFilePoller() {
      if (_lmsFilePoller) { clearInterval(_lmsFilePoller); _lmsFilePoller = null; }
    }


    // Load our self-hosted server's external_api.js script once
    function _loadJitsiApi(cb) {
      if (window.JitsiMeetExternalAPI) { cb(null); return; }
      var s = document.createElement('script');
      s.src = 'https://' + _JITSI_DOMAIN + '/external_api.js';
      s.onload = function() { cb(null); };
      s.onerror = function() { cb('external_api.js failed to load'); };
      document.head.appendChild(s);
    }

    function _onJitsiClosed(reason) {
      if (_jitsiClosed) return;
      _jitsiClosed = true;
      _stopConsultFilePoller();
      console.log('Jitsi: closed event', reason);
      try { if (_jitsiApi) { _jitsiApi.dispose(); _jitsiApi = null; } } catch(_) {}
      try { var cc = document.getElementById('jitsi-container'); if (cc) cc.innerHTML = ''; } catch(_) {}
      try { window.dispatchEvent(new CustomEvent('jitsiEnded', { detail: { reason: reason } })); } catch(_) {}
    }

    window.jitsiJoin = function(roomName, displayName, audioOnly, jwt, subject, authToken, chatChannelName) {
      // Store for consultation file upload
      _consultAuthToken = authToken || _lsToken() || null;
      _consultChatChannel = chatChannelName || roomName;
      _consultSenderName = displayName || 'User';
      _consultSubject = subject || null;

      return new Promise(function(resolve) {
        var checkContainer = function(retries) {
          retries = retries || 0;
          var container = document.getElementById('jitsi-container');
          if (!container) {
            if (retries > 30) { resolve('error:jitsi-container not found'); return; }
            setTimeout(function() { checkContainer(retries + 1); }, 300);
            return;
          }
          _loadJitsiApi(function(err) {
            if (err) { resolve('error:' + err); return; }
            try {
              if (_jitsiApi) { try { _jitsiApi.dispose(); } catch(_) {} _jitsiApi = null; }
              container.innerHTML = '';
              _jitsiRemoteJoined = false;
              _jitsiRemoteLeft = false;
              _jitsiClosed = false;

              // For audio-only calls remove camera + videoquality buttons
              var consultToolbar = (audioOnly === true)
                ? _CONSULTATION_TOOLBAR_BUTTONS.filter(function(b) {
                    return b !== 'camera' && b !== 'videoquality';
                  })
                : _CONSULTATION_TOOLBAR_BUTTONS;

              _jitsiApi = new JitsiMeetExternalAPI(_JITSI_DOMAIN, {
                roomName: roomName,
                jwt: jwt || undefined,
                parentNode: container,
                width: '100%',
                height: '100%',
                configOverwrite: {
                  prejoinPageEnabled: false,
                  requireDisplayName: false,
                  enableWelcomePage: false,
                  enableClosePage: false,
                  disableDeepLinking: true,
                  disableInviteFunctions: true,
                  toolbarButtons: consultToolbar,
                  filmstrip: { disableResizable: false },
                  startWithAudioMuted: false,
                  startWithVideoMuted: audioOnly === true,
                  // localSubject is per-user and never broadcast.  Plain `subject`
                  // must NOT be used here: the doctor is the room moderator, so
                  // their subject would propagate via XMPP to every participant
                  // and overwrite the patient's title with the doctor's one.
                  localSubject: subject || 'iCare Consultation',
                  disabledNotifications: ['notify.moderator'],
                  // NOTE: enableUserRolesBasedOnToken intentionally omitted — it makes
                  // the client assume moderator status merely from HAVING a valid JWT,
                  // regardless of the token's actual moderator:true/false claim. Real
                  // moderator assignment now happens server-side (prosody's
                  // token_affiliation_legacy plugin sets MUC owner/member affiliation
                  // from the claim), so the client should just follow normal XMPP
                  // presence/role updates instead of self-assuming a role.
                },
                interfaceConfigOverwrite: _CONSULTATION_INTERFACE_OVERWRITE,
                userInfo: { displayName: displayName || 'User' },
              });
              _jitsiApi.on('videoConferenceLeft', function() { _onJitsiClosed('videoConferenceLeft'); });
              _jitsiApi.on('readyToClose',        function() { _onJitsiClosed('readyToClose'); });
              _jitsiApi.on('participantJoined',   function() {
                _jitsiRemoteJoined = true; _jitsiRemoteLeft = false;
                console.log('Jitsi: participant joined');
              });
              _jitsiApi.on('participantLeft', function() {
                _jitsiRemoteLeft = true;
                console.log('Jitsi: participant left');
              });

              _startConsultFilePoller();
              _postToJitsi({ type: 'icare-context', mode: 'consultation' });
              setTimeout(window.raiseFlutterLayer, 1200);
              console.log('Jitsi: joining room', roomName, 'as', displayName, '| subject:', subject);
              resolve('ok');
            } catch(e) {
              console.error('jitsiJoin error:', e);
              resolve('error:' + (e.message || String(e)));
            }
          });
        };
        checkContainer();
      });
    };

    // ── Receive file uploads from inside the Jitsi iframe (cross-origin postMessage) ──
    // The polls tab inside Jitsi is repurposed as "File Upload" via icare-custom.js
    // on the Jitsi server.  When the user picks a file there, it arrives here as
    // a postMessage from the Jitsi origin and we forward it to the call-chat API.
    // Only one of the two Jitsi instances (consultation _jitsiApi or LMS
    // _lmsJitsiApi) is ever active in a tab at a time, so falling back between
    // the two sets of globals is safe and covers both flows with one listener.
    window.addEventListener('message', function(e) {
      if (e.origin !== 'https://vh.itserver.biz') return;
      var msg = e.data;
      if (!msg || msg.type !== 'icare-file-upload') return;
      var channel = _consultChatChannel || _lmsChatChannel;
      var token = _consultAuthToken || _lmsAuthToken || _lsToken();
      var sender = _consultSenderName || _lmsSenderName || 'User';
      console.log('[iCare file-upload] received from iframe. channel=', channel, 'hasToken=', !!token, 'sender=', sender, 'bytes=', (msg.data||'').length);
      if (!token || !channel) {
        console.warn('[iCare file-upload] DROPPED — missing auth/channel. consultChannel=', _consultChatChannel, 'lmsChannel=', _lmsChatChannel);
        return;
      }
      fetch('https://icare-backend-inky.vercel.app/api/call-chat/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ channelName: channel, sender: sender, text: msg.data }),
      }).then(function(r) {
        console.log('[iCare file-upload] send response status:', r.status);
        return r.json().catch(function(){ return null; });
      }).then(function(j) { console.log('[iCare file-upload] send response body:', j); })
        .catch(function(err) { console.warn('[iCare file-upload] send FAILED:', err); });
    });

    window.jitsiLeave = function() {
      return new Promise(function(resolve) {
        _stopConsultFilePoller();
        try { if (_jitsiApi) { _jitsiApi.dispose(); _jitsiApi = null; } } catch(_) {}
        try {
          var c = document.getElementById('jitsi-container');
          if (c) c.innerHTML = '';
        } catch(_) {}
        _jitsiRemoteJoined = false;
        _jitsiRemoteLeft = false;
        resolve();
      });
    };

    window.jitsiMuteMic = function(mute) { /* Jitsi's own UI controls media */ };
    window.jitsiMuteCam = function(mute) { /* Jitsi's own UI controls media */ };

    window.jitsiIsRemoteJoined = function() { return _jitsiRemoteJoined === true; };
    window.jitsiIsRemoteLeft   = function() { return _jitsiRemoteLeft === true; };
    window.jitsiIsClosed       = function() { return _jitsiClosed === true; };

    // ── Ringtone (Web Audio API — no external file needed) ─────────────────
    var _ringtoneInterval = null;
    var _ringtoneCtx = null;

    window.playRingtone = function() {
      try {
        if (_ringtoneInterval) return;
        _ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();

        function ringOnce() {
          if (!_ringtoneCtx) return;
          [480, 440].forEach(function(freq) {
            var osc = _ringtoneCtx.createOscillator();
            var gain = _ringtoneCtx.createGain();
            osc.connect(gain);
            gain.connect(_ringtoneCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0, _ringtoneCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, _ringtoneCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.25, _ringtoneCtx.currentTime + 0.35);
            gain.gain.linearRampToValueAtTime(0, _ringtoneCtx.currentTime + 0.5);
            osc.start(_ringtoneCtx.currentTime);
            osc.stop(_ringtoneCtx.currentTime + 0.5);
          });
        }

        ringOnce();
        _ringtoneInterval = setInterval(ringOnce, 2000);
      } catch(e) { console.warn('Ringtone error:', e); }
    };

    window.stopRingtone = function() {
      try {
        if (_ringtoneInterval) { clearInterval(_ringtoneInterval); _ringtoneInterval = null; }
        if (_ringtoneCtx) { _ringtoneCtx.close(); _ringtoneCtx = null; }
      } catch(_) {}
    };

    // ── Water Reminder Notifications ──────────────────────────────────────
    var _waterReminderTimer = null;

    window.scheduleWaterReminderInterval = function(intervalMinutes) {
      try {
        if (_waterReminderTimer) { clearInterval(_waterReminderTimer); _waterReminderTimer = null; }
        var ms = intervalMinutes * 60 * 1000;
        _waterReminderTimer = setInterval(function() {
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              new Notification('Drink Water 💧', {
                body: 'Time to drink a glass of water! Stay hydrated.',
                icon: '/icons/Icon-192.png',
              });
            }
            window.dispatchEvent(new CustomEvent('icare-reminder', {
              detail: JSON.stringify({ type: 'water', title: 'Drink Water 💧', body: 'Time to drink a glass of water! Stay hydrated.' })
            }));
          } catch(e) { console.warn('Water notification error:', e); }
        }, ms);
        console.log('Water reminder scheduled every', intervalMinutes, 'minutes');
      } catch(e) { console.warn('scheduleWaterReminderInterval error:', e); }
    };

    window.cancelWaterReminder = function() {
      if (_waterReminderTimer) { clearInterval(_waterReminderTimer); _waterReminderTimer = null; }
    };

    // ── Generic Daily Reminder Notifications ──────────────────────────────
    var _dailyReminderTimers = {};

    window.scheduleDailyReminder = function(type, title, body, hour, minute) {
      try {
        if (_dailyReminderTimers[type + '_t']) clearTimeout(_dailyReminderTimers[type + '_t']);
        if (_dailyReminderTimers[type + '_i']) clearInterval(_dailyReminderTimers[type + '_i']);

        function fire() {
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              new Notification(title, { body: body, icon: '/icons/Icon-192.png' });
            }
            window.dispatchEvent(new CustomEvent('icare-reminder', {
              detail: JSON.stringify({ type: type, title: title, body: body })
            }));
          } catch(e) { console.warn('Daily reminder fire error:', e); }
        }

        var now  = new Date();
        var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 1);
        var delay = next - now;

        _dailyReminderTimers[type + '_t'] = setTimeout(function() {
          fire();
          _dailyReminderTimers[type + '_i'] = setInterval(fire, 24 * 60 * 60 * 1000);
        }, delay);

        console.log('Daily reminder scheduled:', type, 'at',
          (hour < 10 ? '0' : '') + hour + ':' + (minute < 10 ? '0' : '') + minute,
          '— fires in', Math.round(delay / 60000), 'min');
      } catch(e) { console.warn('scheduleDailyReminder error:', e); }
    };

    window.cancelDailyReminder = function(type) {
      try {
        if (_dailyReminderTimers[type + '_t']) { clearTimeout(_dailyReminderTimers[type + '_t']); delete _dailyReminderTimers[type + '_t']; }
        if (_dailyReminderTimers[type + '_i']) { clearInterval(_dailyReminderTimers[type + '_i']); delete _dailyReminderTimers[type + '_i']; }
        console.log('Daily reminder cancelled:', type);
      } catch(e) {}
    };
  </script>
  <!-- Kill any previously registered Flutter service worker — serves stale main.dart.js from cache -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      }).catch(function(){});
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        }).catch(function(){});
      }
    }
  </script>
  <!-- reCAPTCHA v2 — visible "I'm not a robot" checkbox widget. Rendered
       explicitly (onload=icareRecaptchaOnLoad) into a container div that
       Dart embeds via HtmlElementView. Bridged to Dart via CustomEvents
       (same pattern as icare-reminder below) instead of Promise/js_util
       interop, which isn't stable across Dart SDK versions in this project.
       requestId not needed for the checkbox flow itself, but kept so the
       response/error/expired callbacks all funnel through the same event
       contract that recaptcha_web.dart already listens on. -->
  <script src="https://www.google.com/recaptcha/api.js?onload=icareRecaptchaOnLoad&render=explicit" async defer></script>
  <script>
    var ICARE_RECAPTCHA_SITE_KEY = '6LdJj3ctAAAAALkUpo1t1ZRodsIsrxnj0Qg-N6wR';
    var _icareRecaptchaWidgetId = null;

    function _icareRecaptchaEmit(token) {
      window.dispatchEvent(new CustomEvent('icare-recaptcha-result', {
        detail: JSON.stringify({ token: token })
      }));
    }

    // Called by Google's script once it has loaded (onload= param above).
    // Actual widget rendering happens lazily on 'icare-recaptcha-mount'
    // (dispatched by Dart once the container div exists in the DOM).
    window.icareRecaptchaOnLoad = function() {
      window.dispatchEvent(new CustomEvent('icare-recaptcha-ready'));
    };

    window.addEventListener('icare-recaptcha-mount', function(e) {
      try {
        if (!window.grecaptcha || !grecaptcha.render) return;
        var containerId = (e.detail && JSON.parse(e.detail).containerId) || 'icare-recaptcha-container';
        var el = document.getElementById(containerId);
        if (!el) return;
        // This is a SPA (go_router, no full page reload between screens) —
        // navigating from e.g. /signup to /work-with-us reuses the same
        // container element id in a brand-new DOM node, but the previous
        // widget id was never cleared, so this early-returned forever and
        // the checkbox silently never rendered on any screen visited after
        // the first one in a session. If the element grecaptcha last
        // rendered into is no longer actually attached to the document,
        // it's safe (and necessary) to render a fresh widget here.
        if (_icareRecaptchaWidgetId !== null && el.childElementCount > 0) return;
        _icareRecaptchaWidgetId = grecaptcha.render(containerId, {
          sitekey: ICARE_RECAPTCHA_SITE_KEY,
          callback: function(token) { _icareRecaptchaEmit(token); },
          'expired-callback': function() { _icareRecaptchaEmit(null); },
          'error-callback': function() { _icareRecaptchaEmit(null); },
        });
      } catch (err) { _icareRecaptchaEmit(null); }
    });

    // Dart calls this on submit to read the current checkbox response
    // without forcing the user to re-check it; result comes back on the
    // same 'icare-recaptcha-result' event the callback above uses.
    window.addEventListener('icare-recaptcha-request', function() {
      try {
        if (!window.grecaptcha || _icareRecaptchaWidgetId === null) { _icareRecaptchaEmit(null); return; }
        _icareRecaptchaEmit(grecaptcha.getResponse(_icareRecaptchaWidgetId) || null);
      } catch (err) { _icareRecaptchaEmit(null); }
    });

    window.addEventListener('icare-recaptcha-reset', function() {
      try {
        if (window.grecaptcha && _icareRecaptchaWidgetId !== null) grecaptcha.reset(_icareRecaptchaWidgetId);
      } catch (err) {}
    });
  </script>
  <!-- SystemSound.play() (Flutter's built-in alert-sound API) is a no-op on
       web — there's no OS alert sound to hook into, so notification banners
       played silently despite the Dart code "calling" it. A short beep
       synthesized via the Web Audio API is the actual fix; Dart triggers it
       by dispatching 'icare-notify-tone', same CustomEvent bridge pattern
       used for reCAPTCHA/reminders above (avoids needing an audio package
       or asset file for a ~2-3s two-tone beep). -->
  <script>
    window.addEventListener('icare-notify-tone', function() {
      try {
        var ctx = window._icareAudioCtx || (window._icareAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
        if (ctx.state === 'suspended') ctx.resume();
        function beep(freq, startAt, duration) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
          gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + startAt + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + startAt);
          osc.stop(ctx.currentTime + startAt + duration + 0.05);
        }
        // Two-note chime, ~0.6s total — audible and distinct without being
        // a jarring multi-second siren.
        beep(880, 0, 0.18);
        beep(1174.66, 0.16, 0.32);
      } catch (err) {}
    });
  </script>

  <!-- LMS Live Session — Jitsi Meet (direct iframe) + MediaRecorder -->
  <script>
    // ── LMS Jitsi Meet ────────────────────────────────────────────────────
    var _lmsJitsiClosed = false;
    var _lmsJitsiApi = null;

    window.lmsRaiseFlutterLayer = function() {
      document.querySelectorAll('flt-glass-pane,flt-text-editing-host').forEach(function(el) {
        el.style.zIndex = '99999';
      });
    };

    // Students keep the native hangup button but not the recording start/stop control.
    function _lmsToolbarButtonsFor(isInstructor) {
      if (isInstructor) return _JITSI_TOOLBAR_BUTTONS;
      // Polls are instructor-only — students should only be able to answer
      // an existing poll (Jitsi still lets them do that from the same
      // panel), never see "Create a poll" themselves. Jitsi's own toolbar
      // filter only hides the panel-opening button, not the create button
      // inside the panel, so this alone isn't the full fix — see the poll
      // config disabling create in configOverwrite below.
      return _JITSI_TOOLBAR_BUTTONS.filter(function(b) {
        return b !== 'recording';
      });
    }

    function _onLmsJitsiClosed(reason) {
      if (_lmsJitsiClosed) return;
      _lmsJitsiClosed = true;
      _stopLmsFilePoller();
      console.log('LMS Jitsi: closed event', reason);
      try { if (_lmsJitsiApi) { _lmsJitsiApi.dispose(); _lmsJitsiApi = null; } } catch(_) {}
      try { var cc = document.getElementById('lms-jitsi-host'); if (cc) cc.innerHTML = ''; } catch(_) {}
      try { window.dispatchEvent(new CustomEvent('lmsJitsiEnded', { detail: { reason: reason } })); } catch(_) {}
    }

    window.lmsJitsiJoin = function(roomName, displayName, isInstructor, jwt, subject, authToken) {
      // authToken passed directly from Dart (most reliable); fall back to
      // localStorage only if Dart didn't supply it.
      _lmsAuthToken = (authToken && authToken.length > 10) ? authToken : (_lsToken() || null);
      _lmsChatChannel = roomName;
      _lmsSenderName = displayName || (isInstructor ? 'Instructor' : 'Student');
      _lmsIsInstructor = !!isInstructor;

      var checkContainer = function(retries) {
        retries = retries || 0;
        var container = document.getElementById('lms-jitsi-host');
        if (!container) {
          if (retries > 30) { console.warn('lmsJitsiJoin: lms-jitsi-host not found'); return; }
          setTimeout(function() { checkContainer(retries + 1); }, 300);
          return;
        }
        try {
          if (_lmsJitsiApi) { try { _lmsJitsiApi.dispose(); } catch(_) {} _lmsJitsiApi = null; }
          container.innerHTML = '';
          _lmsJitsiClosed = false;

          _lmsJitsiApi = new JitsiMeetExternalAPI(_JITSI_DOMAIN, {
            roomName: roomName,
            jwt: jwt || undefined,
            parentNode: container,
            width: '100%',
            height: '100%',
            configOverwrite: {
              prejoinPageEnabled: false,
              requireDisplayName: false,
              enableWelcomePage: false,
              enableClosePage: false,
              disableDeepLinking: true,
              disableInviteFunctions: true,
              toolbarButtons: _lmsToolbarButtonsFor(isInstructor),
              filmstrip: { disableResizable: false },
              startWithAudioMuted: false,
              startWithVideoMuted: false,
              // Suppresses the "You are now a moderator" toast — role assignment
              // can lag by a second or two right after join and was showing for
              // students during that window too.
              disabledNotifications: ['notify.moderator'],
              // NOTE: enableUserRolesBasedOnToken intentionally omitted — it makes
              // the client assume moderator status merely from HAVING a valid JWT,
              // regardless of the token's actual moderator:true/false claim. Real
              // moderator assignment now happens server-side (prosody's
              // token_affiliation_legacy plugin sets MUC owner/member affiliation
              // from the claim), so the client should just follow normal XMPP
              // presence/role updates instead of self-assuming a role.
              subject: subject || undefined,
            },
            interfaceConfigOverwrite: _JITSI_INTERFACE_OVERWRITE,
            userInfo: { displayName: displayName || (isInstructor ? 'Instructor' : 'Student') },
          });
          _lmsJitsiApi.on('videoConferenceLeft', function() { _onLmsJitsiClosed('videoConferenceLeft'); });
          _lmsJitsiApi.on('readyToClose',        function() { _onLmsJitsiClosed('readyToClose'); });

          // Fallback: explicitly set subject once joined in case constructor option isn't picked up.
          if (subject) {
            _lmsJitsiApi.on('videoConferenceJoined', function() {
              try { _lmsJitsiApi.executeCommand('subject', subject); } catch(_) {}
            });
          }

          // Auto-start Jibri (server-side) recording for the instructor as soon as they've joined.
          if (isInstructor) {
            _lmsJitsiApi.on('videoConferenceJoined', function() {
              try {
                _lmsJitsiApi.executeCommand('startRecording', { mode: 'file' });
                console.log('LMS Jitsi: auto-starting Jibri recording');
              } catch(e) {
                console.warn('LMS Jitsi: could not auto-start recording:', e.message);
              }
            });
          }

          _startLmsFilePoller();
          _postToJitsiLms({ type: 'icare-context', mode: 'lms', isInstructor: _lmsIsInstructor });
          console.log('LMS Jitsi: joining room', roomName, isInstructor ? '(instructor)' : '(student)');
          setTimeout(window.lmsRaiseFlutterLayer, 1200);
        } catch(e) {
          console.error('lmsJitsiJoin error:', e);
        }
      };

      _loadJitsiApi(function(err) {
        if (err) { console.error('LMS Jitsi:', err); return; }
        checkContainer();
      });
    };

    window.lmsJitsiLeave = function() {
      try { if (_lmsJitsiApi) { _lmsJitsiApi.dispose(); _lmsJitsiApi = null; } } catch(_) {}
      try {
        var c = document.getElementById('lms-jitsi-host');
        if (c) c.innerHTML = '';
      } catch(_) {}
    };

    // Jibri only finalizes + uploads a recording once it receives an explicit stop command.
    // Call this BEFORE lmsJitsiLeave whenever the instructor ends a session.
    window.lmsStopRecording = function() {
      if (!_lmsJitsiApi) return;
      try {
        _lmsJitsiApi.executeCommand('stopRecording', 'file');
        console.log('LMS Jitsi: sent stopRecording command');
      } catch(e) {
        console.warn('LMS Jitsi: stopRecording failed:', e.message);
      }
    };

    window.lmsJitsiIsClosed   = function() { return _lmsJitsiClosed === true; };
    window.lmsJitsiMuteMic    = function(mute) { /* Jitsi's own UI controls media */ };
    window.lmsJitsiMuteCamera = function(mute) { /* Jitsi's own UI controls media */ };

    // Recording is handled entirely by Jibri (server-side) — no client-side MediaRecorder needed.
  </script>
