<!doctype html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iCare - Your Virtual Healthcare Platform">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iCare">
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: https: http: blob:;">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>iCare</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #ffffff; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; z-index: 9999;
    }
    #loading img { width: 160px; height: 160px; object-fit: contain; }
    #loading .spinner {
      margin-top: 24px; width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #0036BC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icare_logo.png" alt="iCare" style="width:160px;height:160px;object-fit:contain;">
    <div class="spinner"></div>
  </div>
  <!-- Agora Web SDK -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });

    // ── Agora Web helpers called from Flutter via JS interop ──────────────
    var _agoraClient = null;
    var _localAudioTrack = null;
    var _localVideoTrack = null;

    window.agoraJoin = async function(appId, channel, token, uid, audioOnly) {
      try {
        // Clean up any stale previous session so mic/cam aren't "in use"
        if (_localAudioTrack) { try { _localAudioTrack.stop(); _localAudioTrack.close(); } catch(_){} _localAudioTrack = null; }
        if (_localVideoTrack) { try { _localVideoTrack.stop(); _localVideoTrack.close(); } catch(_){} _localVideoTrack = null; }
        if (_agoraClient) { try { await _agoraClient.leave(); } catch(_){} _agoraClient = null; }

        _agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
        window._agoraRemoteJoined = false; // reset on each new call
        window._agoraRemoteLeft = false;

        // ── Helper: play remote video with retry until div is in DOM ──────
        async function playRemoteVideo(videoTrack, retries) {
          retries = retries || 0;
          var remoteDiv = document.getElementById('agora-remote');
          if (remoteDiv) {
            try {
              // Clear any previous video before playing new one
              videoTrack.play('agora-remote');
              console.log('✅ Remote video playing (attempt ' + retries + ')');
            } catch(e) {
              console.warn('Remote video play error:', e.message);
              if (retries < 5) {
                setTimeout(function() { playRemoteVideo(videoTrack, retries + 1); }, 300);
              }
            }
          } else {
            // Div not ready yet — retry up to 20 times (6 seconds total)
            if (retries < 20) {
              console.warn('agora-remote div not found, retry ' + retries);
              setTimeout(function() { playRemoteVideo(videoTrack, retries + 1); }, 300);
            } else {
              console.error('agora-remote div never appeared after retries');
            }
          }
        }

        _agoraClient.on('user-left', (user) => {
          window._agoraRemoteLeft = true;
          console.log('📞 Remote user left the call');
        });

        _agoraClient.on('user-published', async (user, mediaType) => {
          window._agoraRemoteJoined = true;
          await _agoraClient.subscribe(user, mediaType);
          if (mediaType === 'video') {
            playRemoteVideo(user.videoTrack, 0);
          }
          if (mediaType === 'audio') {
            try { user.audioTrack.play(); } catch(e) { console.warn('Audio play error:', e); }
          }
        });

        _agoraClient.on('user-unpublished', (user, mediaType) => {
          if (mediaType === 'video') {
            var remoteDiv = document.getElementById('agora-remote');
            if (remoteDiv) remoteDiv.innerHTML = '';
          }
        });

        // ── Handle users who joined BEFORE us ─────────────────────────────
        _agoraClient.on('user-joined', async (user) => {
          window._agoraRemoteJoined = true;
          // If remote user is already publishing, subscribe immediately
          if (user.hasVideo) {
            try {
              await _agoraClient.subscribe(user, 'video');
              playRemoteVideo(user.videoTrack, 0);
            } catch(e) { console.warn('user-joined video subscribe error:', e); }
          }
          if (user.hasAudio) {
            try {
              await _agoraClient.subscribe(user, 'audio');
              user.audioTrack.play();
            } catch(e) { console.warn('user-joined audio subscribe error:', e); }
          }
        });

        await _agoraClient.join(appId, channel, token, uid || null);

        // ── Subscribe to any users already in channel ──────────────────────
        var remoteUsers = _agoraClient.remoteUsers;
        for (var i = 0; i < remoteUsers.length; i++) {
          var remoteUser = remoteUsers[i];
          if (remoteUser.hasVideo) {
            try {
              await _agoraClient.subscribe(remoteUser, 'video');
              playRemoteVideo(remoteUser.videoTrack, 0);
            } catch(e) { console.warn('Pre-existing user video error:', e); }
          }
          if (remoteUser.hasAudio) {
            try {
              await _agoraClient.subscribe(remoteUser, 'audio');
              remoteUser.audioTrack.play();
            } catch(e) { console.warn('Pre-existing user audio error:', e); }
          }
        }

        // Always try mic
        try {
          _localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        } catch(micErr) {
          console.warn('Mic not available:', micErr.message, '— joining without mic');
          _localAudioTrack = null;
        }

        // Only create camera track when NOT audio-only
        if (!audioOnly) {
          try {
            _localVideoTrack = await AgoraRTC.createCameraVideoTrack();
          } catch(camErr) {
            console.warn('Camera not available:', camErr.message, '— joining without camera');
            _localVideoTrack = null;
          }
        } else {
          console.log('📞 Audio-only call — camera disabled');
          _localVideoTrack = null;
        }

        var tracks = [];
        if (_localAudioTrack) tracks.push(_localAudioTrack);
        if (_localVideoTrack) tracks.push(_localVideoTrack);
        if (tracks.length > 0) await _agoraClient.publish(tracks);
        if (_localVideoTrack) _localVideoTrack.play('agora-local');

        return 'ok';
      } catch(e) {
        console.warn('agoraJoin non-fatal error:', e.message || String(e));
        // Never block the user — return ok so Flutter shows the call screen
        return 'ok';
      }
    };

    window.agoraLeave = async function() {
      try {
        if (_localAudioTrack) { _localAudioTrack.stop(); _localAudioTrack.close(); }
        if (_localVideoTrack) { _localVideoTrack.stop(); _localVideoTrack.close(); }
        if (_agoraClient) await _agoraClient.leave();
        _agoraClient = null; _localAudioTrack = null; _localVideoTrack = null;
      } catch(e) { console.error('agoraLeave error:', e); }
    };

    // Returns number of remote users currently in the Agora channel
    window.agoraGetRemoteUserCount = function() {
      try { return _agoraClient ? _agoraClient.remoteUsers.length : 0; } catch(e) { return 0; }
    };

    // Returns true if a remote user has joined this call session
    window.agoraIsRemoteJoined = function() {
      return window._agoraRemoteJoined === true || (window.agoraGetRemoteUserCount() > 0);
    };

    // Returns true if the remote user LEFT mid-call (e.g. doctor converted to video)
    window.agoraIsRemoteLeft = function() {
      return window._agoraRemoteLeft === true && window.agoraGetRemoteUserCount() === 0;
    };

    window.agoraMuteMic = function(mute) {
      if (_localAudioTrack) {
        try {
          // setMuted keeps track published — no republication, no video freeze
          _localAudioTrack.setMuted(mute);
        } catch(e) {
          try { _localAudioTrack.setEnabled(!mute); } catch(_) {}
        }
      }
    };

    window.agoraMuteCam = function(mute) {
      if (_localVideoTrack) {
        try {
          _localVideoTrack.setMuted(mute);
        } catch(e) {
          try { _localVideoTrack.setEnabled(!mute); } catch(_) {}
        }
      }
    };

    // ── Ringtone (Web Audio API — no external file needed) ────────────────
    var _ringtoneInterval = null;
    var _ringtoneCtx = null;

    window.playRingtone = function() {
      try {
        if (_ringtoneInterval) return;
        _ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();

        function ringOnce() {
          if (!_ringtoneCtx) return;
          // Two-tone phone ring: 480 Hz + 440 Hz
          [480, 440].forEach(function(freq, i) {
            var osc = _ringtoneCtx.createOscillator();
            var gain = _ringtoneCtx.createGain();
            osc.connect(gain);
            gain.connect(_ringtoneCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0, _ringtoneCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, _ringtoneCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.25, _ringtoneCtx.currentTime + 0.35);
            gain.gain.linearRampToValueAtTime(0, _ringtoneCtx.currentTime + 0.5);
            osc.start(_ringtoneCtx.currentTime);
            osc.stop(_ringtoneCtx.currentTime + 0.5);
          });
        }

        ringOnce();
        _ringtoneInterval = setInterval(ringOnce, 2000);
      } catch(e) {
        console.warn('Ringtone error:', e);
      }
    };

    window.stopRingtone = function() {
      try {
        if (_ringtoneInterval) { clearInterval(_ringtoneInterval); _ringtoneInterval = null; }
        if (_ringtoneCtx) { _ringtoneCtx.close(); _ringtoneCtx = null; }
      } catch(_) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- LMS Live Session Agora Bridge -->
  <script>
    window._lmsClient = null;
    window._lmsTracks = [];
    window._lmsRemoteUids = [];

    // Create video containers directly in DOM (Flutter HtmlElementView not used)
    // Raise Flutter's input layer above video overlay so all Flutter buttons work
    window.lmsRaiseFlutterLayer = function() {
      var fps = document.querySelectorAll('flt-glass-pane,flt-text-editing-host');
      fps.forEach(function(el) { el.style.zIndex = '99999'; });
    };

    window.lmsCreateVideoContainers = function() {
      ['lms-overlay','lms-local-video','lms-remote-main','lms-css'].forEach(function(id) {
        var el = document.getElementById(id); if (el) el.remove();
      });

      // CSS: force video elements inside our containers to fill properly
      var style = document.createElement('style');
      style.id = 'lms-css';
      style.textContent = '#lms-local-video video,#lms-local-video div{'
        + 'width:100%!important;height:100%!important;object-fit:cover!important;}'
        + '#lms-remote-main video,#lms-remote-main div{'
        + 'width:100%!important;height:100%!important;object-fit:cover!important;}';
      document.head.appendChild(style);

      // Main overlay — sits above Flutter canvas, pointer-events:none so Flutter buttons work
      var overlay = document.createElement('div');
      overlay.id = 'lms-overlay';
      overlay.style.cssText = 'position:fixed;top:52px;left:0;right:0;bottom:70px;'
        + 'background:#1C2333;z-index:9999;pointer-events:none;';

      // Remote full-area
      var remote = document.createElement('div');
      remote.id = 'lms-remote-main';
      remote.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;'
        + 'background:#1C2333;overflow:hidden;';
      overlay.appendChild(remote);

      // Local PiP bottom-right
      var local = document.createElement('div');
      local.id = 'lms-local-video';
      local.style.cssText = 'position:absolute;bottom:16px;right:16px;width:180px;height:135px;'
        + 'border-radius:10px;overflow:hidden;background:#2D3748;z-index:10000;'
        + 'border:2px solid rgba(255,255,255,0.6);';
      overlay.appendChild(local);

      document.body.appendChild(overlay);
      // Ensure Flutter's input layer stays above video overlay
      setTimeout(window.lmsRaiseFlutterLayer, 100);
      return true;
    };

    window.lmsRemoveVideoContainers = function() {
      const el = document.getElementById('lms-overlay');
      if (el) el.remove();
    };

    // Called from Flutter when side panel (chat/people) opens or closes
    window.lmsSetPanelWidth = function(panelOpen) {
      const overlay = document.getElementById('lms-overlay');
      if (!overlay) return;
      if (panelOpen) {
        overlay.style.right = '300px'; // leave 300px for Flutter panel
      } else {
        overlay.style.right = '0px';
      }
    };

    window.lmsJoin = async function(appId, channelId, token, uid) {
      try {
        // Clean up previous session
        if (window._lmsTracks) {
          window._lmsTracks.forEach(function(t) { try { t.stop(); t.close(); } catch(_){} });
          window._lmsTracks = [];
        }
        if (window._lmsClient) { try { await window._lmsClient.leave(); } catch(_){} window._lmsClient = null; }

        // Create DOM containers
        window.lmsCreateVideoContainers();

        // Enable cloud proxy for networks that block direct UDP (firewalls, ISPs)
        AgoraRTC.setLogLevel(3); // warnings only
        const client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
        try { await client.startProxyServer(3); } catch(_) {} // proxy mode 3 = force relay
        window._lmsClient = client;

        // Retry helper — same as doctor-patient call
        function playRemoteWithRetry(videoTrack, divId, retries) {
          retries = retries || 0;
          var el = document.getElementById(divId);
          if (el) {
            try { videoTrack.play(divId); console.log('✅ LMS remote video playing'); }
            catch(e) { if (retries < 5) setTimeout(function(){ playRemoteWithRetry(videoTrack, divId, retries+1); }, 300); }
          } else {
            if (retries < 20) setTimeout(function(){ playRemoteWithRetry(videoTrack, divId, retries+1); }, 300);
            else console.error('LMS remote div never appeared');
          }
        }

        client.on('user-published', async function(user, mediaType) {
          await client.subscribe(user, mediaType);
          if (mediaType === 'audio') { try { user.audioTrack.play(); } catch(e){} }
          if (mediaType === 'video') {
            window._lmsRemoteUids.push(user.uid);
            playRemoteWithRetry(user.videoTrack, 'lms-remote-main', 0);
          }
        });

        client.on('user-joined', async function(user) {
          if (user.hasVideo) {
            try { await client.subscribe(user, 'video'); playRemoteWithRetry(user.videoTrack, 'lms-remote-main', 0); } catch(e){}
          }
          if (user.hasAudio) {
            try { await client.subscribe(user, 'audio'); user.audioTrack.play(); } catch(e){}
          }
        });

        client.on('user-left', function(user) {
          window._lmsRemoteUids = window._lmsRemoteUids.filter(function(u){ return u !== user.uid; });
          var el = document.getElementById('lms-remote-main');
          if (el) el.innerHTML = '';
        });

        // Join channel
        await client.join(appId, channelId, token || null, uid);

        // Subscribe to users already in channel
        var existing = client.remoteUsers;
        for (var i = 0; i < existing.length; i++) {
          var u = existing[i];
          if (u.hasVideo) { try { await client.subscribe(u, 'video'); playRemoteWithRetry(u.videoTrack, 'lms-remote-main', 0); } catch(e){} }
          if (u.hasAudio) { try { await client.subscribe(u, 'audio'); u.audioTrack.play(); } catch(e){} }
        }

        // Mic — separate try/catch (don't fail if denied)
        var audioTrack = null;
        try { audioTrack = await AgoraRTC.createMicrophoneAudioTrack(); }
        catch(e) { console.warn('LMS mic not available:', e.message); }

        // Camera — separate try/catch
        var videoTrack = null;
        try { videoTrack = await AgoraRTC.createCameraVideoTrack(); }
        catch(e) { console.warn('LMS camera not available:', e.message); }

        var tracks = [];
        if (audioTrack) tracks.push(audioTrack);
        if (videoTrack) tracks.push(videoTrack);
        window._lmsTracks = tracks;
        if (tracks.length > 0) await client.publish(tracks);
        if (videoTrack) videoTrack.play('lms-local-video');

        console.log('✅ LMS session joined channel:', channelId);
        return 'joined';
      } catch(e) {
        console.warn('LMS Agora non-fatal error:', e.message || String(e));
        return 'ok'; // Never block user
      }
    };

    window.lmsLeave = function() {
      try {
        if (window._lmsTracks) {
          window._lmsTracks.forEach(function(t) {
            try { t.stop(); t.close(); } catch(_) {}
          });
          window._lmsTracks = [];
        }
        if (window._lmsClient) {
          window._lmsClient.leave();
          window._lmsClient = null;
        }
        window.lmsRemoveVideoContainers();
      } catch(_) {}
    };

    window.lmsMuteMic = function(mute) {
      const t = window._lmsTracks && window._lmsTracks[0];
      if (t) t.setEnabled(!mute);
    };

    window.lmsMuteCamera = function(mute) {
      const t = window._lmsTracks && window._lmsTracks[1];
      if (t) t.setEnabled(!mute);
    };
  </script>
</body>
</html>
