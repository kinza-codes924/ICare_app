<!doctype html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iCare - Your Virtual Healthcare Platform">
  <meta name="google-signin-client_id" content="1076307742101-avj49igc93qipdcnqbqsk3u14gdcb2oh.apps.googleusercontent.com">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iCare">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http: data: blob:; img-src 'self' data: https: http: blob:; frame-src 'self' https://vh.itserver.biz https://icare.com.co https://icare-backend-inky.vercel.app https://docs.google.com https://www.youtube.com https://youtube.com https://player.vimeo.com https://www.google.com https://recaptcha.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://vh.itserver.biz https://cdn.jsdelivr.net https://www.gstatic.com https://accounts.google.com https://www.google.com https://www.recaptcha.net; connect-src 'self' https: http: wss: data: blob:; worker-src 'self' blob: https://www.gstatic.com;">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>iCare</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #ffffff; }
    /* Show native browser scrollbar on Flutter web's glass pane */
    flt-glass-pane { overflow-y: auto !important; }
    flt-glass-pane::-webkit-scrollbar { width: 8px; }
    flt-glass-pane::-webkit-scrollbar-track { background: #f1f5f9; }
    flt-glass-pane::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    flt-glass-pane::-webkit-scrollbar-thumb:hover { background: #64748b; }
    /* Belt-and-suspenders for the LMS Jitsi click-through fix in
       lmsJitsiJoin's ensureJitsiClickable(): if flt-glass-pane still wins
       the paint order over the iframe purely from DOM position (later
       sibling) rather than z-index, an explicit z-index alone on the host
       container won't be enough — this class, toggled onto <body> only
       while an LMS session is open, forces the glass pane itself behind
       it too. Scoped to the class (not a blanket rule) so it never affects
       Flutter UI on any other screen. */
    body.icare-lms-live flt-glass-pane { z-index: 1 !important; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; z-index: 9999;
    }
    #loading img { width: 160px; height: 160px; object-fit: contain; }
    #loading .spinner {
      margin-top: 24px; width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #0036BC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icare_logo.png" alt="iCare" style="width:160px;height:160px;object-fit:contain;">
    <div class="spinner"></div>
  </div>
  <!-- share_plus plugin looks for this element; hidden so old cached share-modal.js never throws -->
  <div id="share-modal" style="display:none"></div>
  <script>
    // Clear any stale retry counter from old deployments
    sessionStorage.removeItem('_icare_retry');

    function _hideLoading() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }
    window.addEventListener('flutter-first-frame', _hideLoading);
    // Fallback timeout hides the spinner after 8 seconds.
    setTimeout(_hideLoading, 8000);

    // ── Raise Flutter glass pane above platform views (Jitsi iframe) ────────
    window.raiseFlutterLayer = function() {
      document.querySelectorAll('flt-glass-pane,flt-text-editing-host').forEach(function(el) {
        el.style.zIndex = '99999';
      });
    };

    // ── Jitsi Meet helpers — Doctor/Patient Consultation (self-hosted Jitsi) ──
    var _JITSI_DOMAIN = 'vh.itserver.biz';
    var _jitsiRemoteJoined = false;
    var _jitsiRemoteLeft = false;
    var _jitsiClosed = false;
    var _jitsiApi = null;

    // Full button set — used by LMS live sessions
    var _JITSI_TOOLBAR_BUTTONS = [
      'microphone', 'camera', 'desktop', 'embedmeeting',
      'fullscreen', 'fodeviceselection', 'hangup', 'profile', 'chat', 'polls',
      'recording', 'etherpad', 'shareaudio',
      'settings', 'raisehand', 'videoquality', 'filmstrip',
      'stats', 'shortcuts', 'tileview', 'videobackgroundblur',
      'download', 'help', 'mute-everyone', 'security', 'toggle-camera',
      'select-background', 'noise-suppression', 'whiteboard'
    ];

    // Stripped-down button set for doctor/patient consultations
    // (no screen share, tile view, raise hand, recording, whiteboard, stats,
    //  shortcuts, shared video/audio, select-background, toggle-camera)
    // 'polls' IS included here even though the consultation flow doesn't use
    // polls — icare-custom.js repurposes the Polls tab itself into "File
    // Upload" for consultations, so the tab must exist for that hijack to work.
    var _CONSULTATION_TOOLBAR_BUTTONS = [
      'microphone', 'camera', 'fullscreen', 'fodeviceselection',
      'hangup', 'chat', 'polls', 'settings', 'videoquality', 'filmstrip',
      'noise-suppression', 'help'
    ];

    var _JITSI_INTERFACE_OVERWRITE = {
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      SHOW_POWERED_BY: false,
      DISABLE_VIDEO_BACKGROUND: false,
      HIDE_DEEP_LINKING_LOGO: true,
      MOBILE_APP_PROMO: false,
    };

    // Consultation interface config — hides moderator/profile/shortcuts/general settings tabs
    var _CONSULTATION_INTERFACE_OVERWRITE = {
      SHOW_JITSI_WATERMARK: false,
      SHOW_WATERMARK_FOR_GUESTS: false,
      SHOW_BRAND_WATERMARK: false,
      SHOW_POWERED_BY: false,
      DISABLE_VIDEO_BACKGROUND: false,
      HIDE_DEEP_LINKING_LOGO: true,
      MOBILE_APP_PROMO: false,
      SETTINGS_SECTIONS: ['devices', 'language', 'sounds'],
    };

    // Globals for consultation file upload
    var _consultAuthToken = null;
    var _consultChatChannel = null;
    var _consultSenderName = null;
    var _consultSubject = null;
    var _consultFilePoller = null;
    var _consultFileCursor = 0;

    // Globals for LMS live-session file upload (mirrors the consultation
    // ones above — lmsJitsiJoin never set any of this, so files picked in
    // the LMS "File Upload" panel had nowhere to go: the shared listener at
    // the bottom always hit the "missing auth/channel" branch and silently
    // dropped them, which is why they vanished right after the local
    // "✓ Shared" confirmation).
    var _lmsAuthToken = null;
    var _lmsChatChannel = null;
    var _lmsSenderName = null;
    var _lmsFilePoller = null;
    var _lmsFileCursor = 0;
    var _lmsIsInstructor = false;

    // Flutter web's shared_preferences JSON-encodes stored strings, so the
    // raw localStorage value is the token WRAPPED IN LITERAL DOUBLE QUOTES
    // ("eyJ..."). Sending that as `Authorization: Bearer "eyJ..."` fails
    // auth (401) on every call-chat request — which is exactly why LMS file
    // uploads (which rely on this fallback; consultations get the token
    // passed explicitly from Dart) were accepted locally but never saved.
    function _lsToken() {
      var t = localStorage.getItem('flutter.token');
      return t ? t.replace(/^"|"$/g, '') : null;
    }

    // Push a message INTO the Jitsi iframe (icare-custom.js listens on the other side)
    function _postToJitsi(msg) {
      try {
        if (!_jitsiApi) return;
        var ifr = _jitsiApi.getIFrame();
        if (ifr && ifr.contentWindow) {
          ifr.contentWindow.postMessage(msg, 'https://' + _JITSI_DOMAIN);
        }
      } catch(_) {}
    }

    // Poll the call-chat API and forward file messages (img:/doc: payloads)
    // into the Jitsi iframe so both parties see shared files in the
    // "File Upload" tab.  Also re-pushes the per-user consultation title so
    // icare-custom.js can override the subject text even if it loads late.
    function _startConsultFilePoller() {
      _stopConsultFilePoller();
      _consultFileCursor = 0;
      _consultFilePoller = setInterval(function() {
        if (!_jitsiApi) return;
        if (_consultSubject) _postToJitsi({ type: 'icare-subject', text: _consultSubject });
        // Re-sent every tick, not just once at join — icare-custom.js loads
        // asynchronously inside the iframe, so a single postMessage right
        // after iframe creation can arrive before its listener exists and be
        // silently dropped (exactly what happened: _mode never got set).
        _postToJitsi({ type: 'icare-context', mode: 'consultation' });
        var token = _consultAuthToken || _lsToken();
        if (!token || !_consultChatChannel) return;
        fetch('https://icare.com.co/api/call-chat/messages/'
              + encodeURIComponent(_consultChatChannel) + '?since=' + _consultFileCursor, {
          headers: { 'Authorization': 'Bearer ' + token },
        }).then(function(r) { return r.json(); })
          .then(function(j) {
            var msgs = (j && j.messages) || [];
            if (!msgs.length) return;
            var files = [];
            msgs.forEach(function(m) {
              var t = (m.text || '') + '';
              var ts = Date.parse(m.createdAt || '') || 0;
              if (ts > _consultFileCursor) _consultFileCursor = ts;
              if (t.indexOf('img:') === 0 || t.indexOf('doc:') === 0) {
                files.push({ sender: m.sender || 'User', text: t, ts: ts });
              }
            });
            if (files.length) _postToJitsi({ type: 'icare-file-list', files: files });
          }).catch(function(){});
      }, 4000);
    }

    function _stopConsultFilePoller() {
      if (_consultFilePoller) { clearInterval(_consultFilePoller); _consultFilePoller = null; }
    }

    // Push a message into the LMS Jitsi iframe (separate instance from the
    // consultation one — _lmsJitsiApi, not _jitsiApi).
    function _postToJitsiLms(msg) {
      try {
        if (!_lmsJitsiApi) return;
        var ifr = _lmsJitsiApi.getIFrame();
        if (ifr && ifr.contentWindow) {
          ifr.contentWindow.postMessage(msg, 'https://' + _JITSI_DOMAIN);
        }
      } catch(_) {}
    }

    // Same call-chat polling/relay as the consultation flow, keyed by the
    // LMS room name instead of a consultation channel — call-chat is a
    // generic channelName-keyed store, not consultation-specific.
    function _startLmsFilePoller() {
      _stopLmsFilePoller();
      _lmsFileCursor = 0;
      _lmsFilePoller = setInterval(function() {
        if (!_lmsJitsiApi) return;
        // Re-sent every tick — see the matching comment in
        // _startConsultFilePoller for why a single send-on-join isn't enough.
        _postToJitsiLms({ type: 'icare-context', mode: 'lms', isInstructor: _lmsIsInstructor });
        var token = _lmsAuthToken || _lsToken();
        if (!token || !_lmsChatChannel) return;
        fetch('https://icare.com.co/api/call-chat/messages/'
              + encodeURIComponent(_lmsChatChannel) + '?since=' + _lmsFileCursor, {
          headers: { 'Authorization': 'Bearer ' + token },
        }).then(function(r) { return r.json(); })
          .then(function(j) {
            var msgs = (j && j.messages) || [];
            console.log('[iCare lms-poll] channel=', _lmsChatChannel, 'since=', _lmsFileCursor, 'gotMessages=', msgs.length);
            if (!msgs.length) return;
            var files = [];
            msgs.forEach(function(m) {
              var t = (m.text || '') + '';
              var ts = Date.parse(m.createdAt || '') || 0;
              if (ts > _lmsFileCursor) _lmsFileCursor = ts;
              if (t.indexOf('img:') === 0 || t.indexOf('doc:') === 0) {
                files.push({ sender: m.sender || 'User', text: t, ts: ts });
              }
            });
            console.log('[iCare lms-poll] matched file messages=', files.length);
            if (files.length) {
              _postToJitsiLms({ type: 'icare-file-list', files: files });
              // Same clickable parent-page toast as chat messages, but
              // opening the File Upload tab instead. Only for files from
              // someone ELSE — the uploader already knows they shared it,
              // and this poller sees their own upload come back too.
              var incoming = files.filter(function(f) { return f.sender !== _lmsSenderName; });
              if (incoming.length) _lmsShowFileToast(incoming[incoming.length - 1].sender);
            }
          }).catch(function(){});
      }, 4000);
    }

    function _stopLmsFilePoller() {
      if (_lmsFilePoller) { clearInterval(_lmsFilePoller); _lmsFilePoller = null; }
    }


    // Load our self-hosted server's external_api.js script once
    function _loadJitsiApi(cb) {
      if (window.JitsiMeetExternalAPI) { cb(null); return; }
      var s = document.createElement('script');
      s.src = 'https://' + _JITSI_DOMAIN + '/external_api.js';
      s.onload = function() { cb(null); };
      s.onerror = function() { cb('external_api.js failed to load'); };
      document.head.appendChild(s);
    }

    function _onJitsiClosed(reason) {
      if (_jitsiClosed) return;
      _jitsiClosed = true;
      _stopConsultFilePoller();
      console.log('Jitsi: closed event', reason);
      try { if (_jitsiApi) { _jitsiApi.dispose(); _jitsiApi = null; } } catch(_) {}
      try { var cc = document.getElementById('jitsi-container'); if (cc) cc.innerHTML = ''; } catch(_) {}
      // Was calling a function that was never defined (_removePrescriptionToggle
      // — the real one is _removeCallTabButtons, defined further down). That
      // threw a ReferenceError right here, which aborted this whole handler
      // BEFORE the jitsiEnded dispatch below ever ran — so Flutter never found
      // out the call had ended, leaving the doctor stuck on the video-call
      // screen with no way back to the prescription/chat view.
      try { _removeCallTabButtons(); } catch(_) {}
      try { window.dispatchEvent(new CustomEvent('jitsiEnded', { detail: { reason: reason } })); } catch(_) {}
    }

    // ── In-call tab toggle buttons — real DOM elements, NOT Flutter
    // widgets. A Flutter FAB stacked in a Positioned over VideoCall's
    // HtmlElementView(Jitsi iframe) turned out to be unclickable in
    // practice (platform-view/glass-pane click routing is unreliable once
    // Jitsi's own iframe is live) — exactly the same class of problem
    // already solved for the LMS chat toast (_lmsBuildToast) by building
    // the element directly in the parent page's real DOM instead of
    // relying on Flutter's compositing.
    //
    // showCallTabButtons(buttons) takes an array of
    // {id, label, side ('left'|'right'), top (px, optional stacking offset)}
    // and renders one button per entry. Clicking a button dispatches
    // 'icareCallTabToggle' with detail={id}. hideCallTabButtons() removes
    // them all. Used for both the single "Prescription" button (walk-in
    // calls) and the two-button "Prescription"/"Patient History" stack
    // (normal consultations).
    var _callTabBtns = [];
    var _callTabContainer = null;
    window.showCallTabButtons = function(buttons) {
      try {
        _removeCallTabButtons();
        // Single container sitting just above the Jitsi toolbar, centered
        var container = document.createElement('div');
        container.id = 'icare-calltab-bar';
        var isMobile = window.innerWidth < 768;
        container.style.cssText = isMobile
          ? 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
            'z-index:2147483000;pointer-events:auto;' +
            'display:flex;flex-direction:row;gap:8px;align-items:center;'
          : 'position:fixed;bottom:16px;left:calc(50% + 260px);' +
            'z-index:2147483000;pointer-events:auto;' +
            'display:flex;flex-direction:row;gap:8px;align-items:center;';
        (buttons || []).forEach(function(b) {
          var btn = document.createElement('button');
          btn.id = 'icare-calltab-' + b.id;
          btn.type = 'button';
          btn.textContent = b.label || b.id;
          btn.style.cssText =
            'background:rgba(30,30,30,0.75);color:#fff;' +
            'border:1px solid rgba(255,255,255,0.2);border-radius:20px;' +
            'padding:9px 18px;font-size:13px;font-weight:600;' +
            'font-family:system-ui,sans-serif;cursor:pointer;' +
            'backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);' +
            'box-shadow:0 2px 8px rgba(0,0,0,0.4);white-space:nowrap;';
          btn.onmouseover = function() { this.style.background='rgba(60,60,60,0.85)'; };
          btn.onmouseout  = function() { this.style.background='rgba(30,30,30,0.75)'; };
          (function(id) {
            btn.addEventListener('click', function() {
              try { window.dispatchEvent(new CustomEvent('icareCallTabToggle', { detail: JSON.stringify({ id: id }) })); } catch(_) {}
            });
          })(b.id);
          container.appendChild(btn);
          _callTabBtns.push(btn);
        });
        document.body.appendChild(container);
        _callTabContainer = container;
      } catch(_) {}
    };
    window.hideCallTabButtons = function() { _removeCallTabButtons(); };
    function _removeCallTabButtons() {
      try { if (_callTabContainer) { _callTabContainer.remove(); _callTabContainer = null; } } catch(_) {}
      _callTabBtns = [];
    }
    // Re-attach container to whichever element is fullscreen so buttons stay
    // visible when Jitsi's "View full screen" button is pressed.
    function _reattachCallTabBtns() {
      if (!_callTabContainer) return;
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      var target = fsEl || document.body;
      try { target.appendChild(_callTabContainer); } catch(_) {}
    }
    document.addEventListener('fullscreenchange', _reattachCallTabBtns);
    document.addEventListener('webkitfullscreenchange', _reattachCallTabBtns);
    // Back-compat single-button aliases — still used by the walk-in call
    // screens (reception_prescription_screen.dart, doctor_call_with_
    // prescription_screen.dart).
    window.showPrescriptionToggle = function(side) {
      window.showCallTabButtons([{ id: 'prescription', label: 'Prescription', side: side }]);
    };
    window.hidePrescriptionToggle = function() { _removeCallTabButtons(); };

    // Panel open/close — disables Jitsi iframe pointer-events so Flutter
    // widgets inside the left panel (TextFields, ListView, accordion tiles)
    // receive clicks/scroll correctly. Without this the iframe's transparent
    // glass pane absorbs all events even though it's visually behind the panel.
    function _setJitsiPointerEvents(enabled) {
      try {
        var ifr = _jitsiApi ? _jitsiApi.getIFrame() : null;
        if (!ifr) {
          // Fallback: target any iframe on the page (Jitsi renders one)
          ifr = document.querySelector('iframe');
        }
        if (ifr) ifr.style.pointerEvents = enabled ? 'auto' : 'none';
      } catch(_) {}
    }
    window.addEventListener('icare-panel-open',  function() { _setJitsiPointerEvents(false); });
    window.addEventListener('icare-panel-close', function() { _setJitsiPointerEvents(true);  });

    // DOM-based prescription preview dialog — renders above Jitsi iframe,
    // Flutter dialogs can't receive clicks when an HtmlElementView is live.
    window.showRxPreviewDialog = function(data) {
      var existing = document.getElementById('icare-rx-dialog');
      if (existing) existing.remove();

      var overlay = document.createElement('div');
      overlay.id = 'icare-rx-dialog';
      overlay.style.cssText =
        'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;' +
        'justify-content:center;background:rgba(0,0,0,0.45);pointer-events:auto;';

      var card = document.createElement('div');
      card.style.cssText =
        'background:#fff;border-radius:12px;width:420px;max-width:92vw;max-height:80vh;' +
        'display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.28);' +
        'font-family:system-ui,sans-serif;overflow:hidden;pointer-events:auto;';

      // Header
      var header = document.createElement('div');
      header.style.cssText =
        'display:flex;align-items:center;padding:14px 16px;' +
        'border-bottom:1px solid #E2E8F0;flex-shrink:0;';
      header.innerHTML =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-right:8px;flex-shrink:0;">' +
        '<path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2z" stroke="#0036BC" stroke-width="2"/>' +
        '<path d="M9 12h6M9 8h6M9 16h4" stroke="#0036BC" stroke-width="2" stroke-linecap="round"/></svg>' +
        '<span style="font-weight:700;font-size:15px;flex:1;">Prescription (Live)</span>';
      var closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.style.cssText =
        'width:28px;height:28px;border-radius:50%;border:none;background:#F1F5F9;' +
        'cursor:pointer;display:flex;align-items:center;justify-content:center;' +
        'font-size:16px;color:#475569;line-height:1;padding:0;';
      closeBtn.textContent = '×';
      closeBtn.onclick = function() { overlay.remove(); };
      header.appendChild(closeBtn);
      card.appendChild(header);

      // Body
      var body = document.createElement('div');
      body.style.cssText = 'padding:16px;overflow-y:auto;flex:1;';

      if (!data || (!data.diagnoses && !data.medicines && !data.labTests && !data.notes)) {
        body.innerHTML = '<p style="color:#64748B;font-size:13px;">Doctor has not yet written a prescription.<br>Check back once the doctor starts filling the form.</p>';
      } else {
        var html = '';
        if (data.diagnoses && data.diagnoses.length) {
          html += '<div style="margin-bottom:12px;">';
          html += '<div style="font-weight:700;font-size:12px;color:#0036BC;margin-bottom:6px;">DIAGNOSIS</div>';
          data.diagnoses.forEach(function(d) {
            html += '<div style="font-size:13px;margin-bottom:4px;">&#8226; ' + (d.name || d) + '</div>';
          });
          html += '</div>';
        }
        if (data.medicines && data.medicines.length) {
          html += '<div style="margin-bottom:12px;">';
          html += '<div style="font-weight:700;font-size:12px;color:#0036BC;margin-bottom:6px;">MEDICINES</div>';
          data.medicines.forEach(function(m) {
            var name = m.medicineName || m.name || '';
            var dose = m.dosage || m.dose || '';
            var freq = m.frequency || '';
            var dur = m.duration || '';
            var detail = [dose, freq, dur].filter(Boolean).join(', ');
            html += '<div style="font-size:13px;margin-bottom:4px;">&#8226; ' + name + (detail ? ' — ' + detail : '') + '</div>';
          });
          html += '</div>';
        }
        if (data.labTests && data.labTests.length) {
          html += '<div style="margin-bottom:12px;">';
          html += '<div style="font-weight:700;font-size:12px;color:#0036BC;margin-bottom:6px;">LAB TESTS</div>';
          data.labTests.forEach(function(t) {
            html += '<div style="font-size:13px;margin-bottom:4px;">&#8226; ' + (t.testName || t.name || t) + '</div>';
          });
          html += '</div>';
        }
        if (data.notes) {
          html += '<div style="margin-bottom:12px;">';
          html += '<div style="font-weight:700;font-size:12px;color:#0036BC;margin-bottom:6px;">NOTES</div>';
          html += '<div style="font-size:13px;">' + data.notes + '</div>';
          html += '</div>';
        }
        body.innerHTML = html;
      }
      card.appendChild(body);

      // Close on overlay click (outside card)
      overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
      overlay.appendChild(card);
      document.body.appendChild(overlay);
    };
    window.hideRxPreviewDialog = function() {
      var el = document.getElementById('icare-rx-dialog');
      if (el) el.remove();
    };

    window.jitsiJoin = function(roomName, displayName, audioOnly, jwt, subject, authToken, chatChannelName) {
      // Store for consultation file upload
      _consultAuthToken = authToken || _lsToken() || null;

       if it hasn't come back shortly after the tab is visible again, reload —
       a reload is what the user was doing by hand anyway. -->

          // Without this the browser will not attempt a restore at all.
          e.preventDefault();
          contextLost = true;
        }, false);
        canvas.addEventListener('webglcontextrestored', function () {
          contextLost = false;
        }, false);

      function watchAll() {
        var list = document.querySelectorAll('canvas');
        for (var i = 0; i < list.length; i++) watchCanvas(list[i]);

      // on the tree rather than binding once.

    }

    function _lmsShowChatToast(sender, message) {
      _lmsBuildToast(sender || 'New message', message, 'Open chat');
    }

    // Same toast for shared files. The drawer that opens is the same one
    // holding Chat / Polls / File Upload tabs, so a single toggleChat gets
    // the user there either way. (Polls have no equivalent toast: Jitsi's
    // External API exposes no poll event — only incomingMessage and
    // participantJoined — so there's nothing to hook for them here.)
    function _lmsShowFileToast(sender) {
      _lmsBuildToast(sender || 'Someone', 'shared a file', 'Open File Upload');
    }

    window.lmsJitsiJoin = function(roomName, displayName, isInstructor, jwt, subject, authToken) {
      // authToken passed directly from Dart (most reliable); fall back to
      // localStorage only if Dart didn't supply it.
      _lmsAuthToken = (authToken && authToken.length > 10) ? authToken : (_lsToken() || null);
      _lmsChatChannel = roomName;
      _lmsSenderName = displayName || (isInstructor ? 'Instructor' : 'Student');
      _lmsIsInstructor = !!isInstructor;

      var checkContainer = function(retries) {
        retries = retries || 0;
        var container = document.getElementById('lms-jitsi-host');
        if (!container) {
          if (retries > 30) { console.warn('lmsJitsiJoin: lms-jitsi-host not found'); return; }
          setTimeout(function() { checkContainer(retries + 1); }, 300);
          return;
        }
        try {
          if (_lmsJitsiApi) { try { _lmsJitsiApi.dispose(); } catch(_) {} _lmsJitsiApi = null; }
          container.innerHTML = '';
          _lmsJitsiClosed = false;

          _lmsJitsiApi = new JitsiMeetExternalAPI(_JITSI_DOMAIN, {
            roomName: roomName,
            jwt: jwt || undefined,
            parentNode: container,
            width: '100%',
            height: '100%',
            configOverwrite: {
              prejoinPageEnabled: false,
              requireDisplayName: false,
              enableWelcomePage: false,
              enableClosePage: false,
              disableDeepLinking: true,
              disableInviteFunctions: true,
              toolbarButtons: _lmsToolbarButtonsFor(isInstructor),
              filmstrip: { disableResizable: false },
              startWithAudioMuted: false,
              startWithVideoMuted: false,
              // notify.moderator: suppresses the "You are now a moderator"
              // toast — role assignment can lag by a second or two right
              // after join and was showing for students during that window.
              // notify.chatMessages: suppresses Jitsi's OWN new-message
              // toast, which has no "Open chat" action in this build and
              // lives in a nested cross-origin iframe we can't touch — we
              // render our own clickable one in the parent page instead
              // (_lmsShowChatToast), so without this both appeared stacked.
              disabledNotifications: ['notify.moderator', 'notify.chatMessages'],
              // NOTE: enableUserRolesBasedOnToken intentionally omitted — it makes
              // the client assume moderator status merely from HAVING a valid JWT,
              // regardless of the token's actual moderator:true/false claim. Real
              // moderator assignment now happens server-side (prosody's
              // token_affiliation_legacy plugin sets MUC owner/member affiliation
              // from the claim), so the client should just follow normal XMPP
              // presence/role updates instead of self-assuming a role.
              subject: subject || undefined,
            },
            interfaceConfigOverwrite: _JITSI_INTERFACE_OVERWRITE,
            userInfo: { displayName: displayName || (isInstructor ? 'Instructor' : 'Student') },
          });
          _lmsJitsiApi.on('videoConferenceLeft', function() { _onLmsJitsiClosed('videoConferenceLeft'); });
          _lmsJitsiApi.on('readyToClose',        function() { _onLmsJitsiClosed('readyToClose'); });

          // Jitsi's own "new message" toast lives inside a NESTED cross-
          // origin iframe (Jitsi wraps its real React app in an inner
          // <iframe>, not directly in the one JitsiMeetExternalAPI creates)
          // — confirmed by hand: even a Shadow-DOM-aware full-document scan
          // from the outer iframe's own console found zero trace of the
          // toast's DOM, so no CSS/click patch from icare-custom.js
          // (running in that outer iframe) could ever reach it, no matter
          // how it was targeted. That's the actual reason all previous
          // click-through attempts failed — not z-index, not the glass
          // pane. JitsiMeetExternalAPI's own incomingMessage event doesn't
          // have this problem (it's delivered via postMessage across every
          // iframe boundary, same channel .on() already uses for
          // videoConferenceLeft etc. above) — use that instead of trying to
          // make the toast itself clickable: open the chat drawer directly
          // the moment a message arrives while it's closed.
          //
          // Rather than auto-opening chat (which steals focus mid-session),
          // render OUR OWN toast here in the parent page — outside the
          // iframe, where we have full DOM control — carrying the "Open
          // chat" action the client asked for. Clicking it runs
          // executeCommand('toggleChat'), which opens Jitsi's real chat
          // drawer (with its Chat / Polls / File Upload tabs).
          _lmsJitsiApi.on('incomingMessage', function(data) {
            try {
              if (data && data.privateMessage) return; // private messages behave normally
              _lmsShowChatToast(data && data.nick, data && data.message);
            } catch(_) {}
          });

          // Fallback: explicitly set subject once joined in case constructor option isn't picked up.
          if (subject) {
            _lmsJitsiApi.on('videoConferenceJoined', function() {
              try { _lmsJitsiApi.executeCommand('subject', subject); } catch(_) {}
            });
          }

          // Auto-start Jibri (server-side) recording for the instructor as soon as they've joined.
          if (isInstructor) {
            _lmsJitsiApi.on('videoConferenceJoined', function() {
              try {
                _lmsJitsiApi.executeCommand('startRecording', { mode: 'file' });
                console.log('LMS Jitsi: auto-starting Jibri recording');
              } catch(e) {
                console.warn('LMS Jitsi: could not auto-start recording:', e.message);
              }
            });
          }

          _startLmsFilePoller();
          _postToJitsiLms({ type: 'icare-context', mode: 'lms', isInstructor: _lmsIsInstructor });
          console.log('LMS Jitsi: joining room', roomName, isInstructor ? '(instructor)' : '(student)');
          document.body.classList.add('icare-lms-live');
          // Explicitly force the Jitsi host container (and the iframe Jitsi
          // creates inside it) above Flutter's glass pane and interactive —
          // don't only rely on flt-glass-pane's default stacking behavior,
          // since that alone wasn't enough (toasts inside Jitsi stayed
          // unclickable even after removing the old lmsRaiseFlutterLayer
          // call below). Runs on a short repeating check because Jitsi
          // creates its <iframe> asynchronously after JitsiMeetExternalAPI
          // is constructed, so it may not exist in the DOM yet right here.
          (function ensureJitsiClickable(retries) {
            retries = retries || 0;
            var c = document.getElementById('lms-jitsi-host');
            if (c) {
              c.style.position = 'relative';
              c.style.zIndex = '2147483000';
              c.style.pointerEvents = 'auto';
              var ifr = c.querySelector('iframe');
              if (ifr) {
                ifr.style.pointerEvents = 'auto';
                ifr.style.position = 'relative';
                ifr.style.zIndex = '2147483000';
                return;
              }
            }
            if (retries < 40) setTimeout(function() { ensureJitsiClickable(retries + 1); }, 250);
          })();
          // Do NOT call lmsRaiseFlutterLayer here. That z-index hack dates
          // back to the pre-Jitsi Agora overlay UI (raw DOM video elements
          // stacked on top of Flutter's own glass pane) — see commit
          // 6b3ada5. This screen embeds Jitsi via a real Flutter
          // HtmlElementView platform view now, which already sits below
          // flt-glass-pane in the correct default stacking order for click-
          // through to work. Raising the glass pane above the iframe here
          // put it above EVERYTHING inside Jitsi for the whole session,
          // silently eating every click on Jitsi's own toasts/notifications
          // (chat message, new poll, our custom "file shared" toast) even
          // though they were visibly rendered — nothing wrong with any of
          // those toasts themselves, they just could never receive a click.
        } catch(e) {
          console.error('lmsJitsiJoin error:', e);
        }
      };

      _loadJitsiApi(function(err) {
        if (err) { console.error('LMS Jitsi:', err); return; }
        checkContainer();
      });
    };

    window.lmsJitsiLeave = function() {
      try { if (_lmsJitsiApi) { _lmsJitsiApi.dispose(); _lmsJitsiApi = null; } } catch(_) {}
      try {
        var c = document.getElementById('lms-jitsi-host');
        if (c) c.innerHTML = '';
      } catch(_) {}
    };

    // Jibri only finalizes + uploads a recording once it receives an explicit stop command.
    // Call this BEFORE lmsJitsiLeave whenever the instructor ends a session.
    window.lmsStopRecording = function() {
      if (!_lmsJitsiApi) return;
      try {
        _lmsJitsiApi.executeCommand('stopRecording', 'file');
        console.log('LMS Jitsi: sent stopRecording command');
      } catch(e) {
        console.warn('LMS Jitsi: stopRecording failed:', e.message);
      }
    };

    window.lmsJitsiIsClosed   = function() { return _lmsJitsiClosed === true; };
    window.lmsJitsiMuteMic    = function(mute) { /* Jitsi's own UI controls media */ };
    window.lmsJitsiMuteCamera = function(mute) { /* Jitsi's own UI controls media */ };

    // Recording is handled entirely by Jibri (server-side) — no client-side MediaRecorder needed.
  </script>


</body>
</html>
