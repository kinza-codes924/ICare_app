  <style>
    body { margin: 0; background: #ffffff; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #ffffff; z-index: 9999;
    }
    #loading img { width: 160px; height: 160px; object-fit: contain; }
    #loading .spinner {
      margin-top: 24px; width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #0036BC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Agora video elements must fill their containers */
    #agora-remote {
      position: relative !important; overflow: hidden !important;
    }
    #agora-remote > div, #agora-remote video {
      position: absolute !important; top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      object-fit: cover; display: block; background: #000;
    }
    #lms-agora-local  > div, #lms-agora-local  video {
      width: 100% !important; height: 100% !important;
      object-fit: cover; display: block;
    }
    /* LMS multi-participant grid tiles */
    /* align-content defaults to 'stretch' (not set here) so every 1fr row
       always fills its full share of the container's height — with N
       tiles across ceil(N/cols) rows, each row gets exactly 1/rows of the
       height, no more, no less. An earlier version forced a fixed 4:3
       aspect-ratio on each tile once there were 2+ tiles; that fought the
       1fr stretch whenever the aspect-derived height came out shorter than
       the row's actual share, leaving dead black space below the last row.
       Removing the aspect-ratio and letting object-fit:cover (below) handle
       any crop/letterbox is what actually keeps every tile filling its box
       with no dead space, for any tile count. */
    #lms-grid-container { display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 4px; padding: 4px; box-sizing: border-box; width: 100%; height: 100%; overflow-y: auto; }
    .lms-remote-tile { position: relative; background: #1a2234; border-radius: 8px; overflow: hidden; min-height: 80px; }
    .lms-remote-tile > div { position: absolute !important; inset: 0; }
    .lms-remote-tile video {
      position: absolute !important; inset: 0;
      width: 100% !important; height: 100% !important;
      object-fit: cover; display: block; background: #000;
    }
    .lms-tile-name {
      position: absolute; bottom: 6px; left: 6px;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px; z-index: 10; pointer-events: none;
    }
    /* Screen-share spotlight (Zoom-style): the sharing participant's
       EXISTING tile grows to fill nearly the whole area; every other
       participant keeps a fixed-size tile in a horizontally SCROLLABLE
       strip below it — never shrunk to the point of disappearing, and
       never clipped by the container height regardless of headcount
       (5, 15, 20+ students all stay reachable via horizontal scroll).
       Deliberately reuses the same tile <div> that's already playing video
       the whole time (just resized via CSS/class toggle) instead of moving
       video into a new container — an earlier "big main view" attempt did
       that (played the track into a separate, previously-hidden element)
       and caused blank/stuck shared screens. #lms-grid-container carries
       inline display:grid set once from Dart, so overriding it needs
       !important same as the rest of this stylesheet's grid overrides. */
    #lms-grid-container.lms-spotlight-active {
      display: flex !important;
      flex-direction: column !important;
      overflow-y: hidden !important;
    }
    #lms-grid-container.lms-spotlight-active .lms-remote-tile {
      aspect-ratio: auto !important;
    }
    #lms-grid-container.lms-spotlight-active .lms-spotlight-tile {
      flex: 1 1 auto !important;
      order: -1 !important;
      min-height: 0 !important;
      width: 100% !important;
    }
    /* Thumbnail strip: fixed height, horizontally scrollable so every
       participant tile stays fully visible (and clickable) no matter how
       many students are in the call — this is the piece that was missing
       before, which let tiles overflow off-screen and "disappear". */
    #lms-grid-container.lms-spotlight-active .lms-thumbnail-strip {
      order: 1 !important;
      flex: 0 0 96px !important;
      display: flex !important;
      flex-direction: row !important;
      gap: 4px !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      padding-top: 4px !important;
    }
    #lms-grid-container.lms-spotlight-active .lms-remote-tile:not(.lms-spotlight-tile) {
      flex: 0 0 128px !important;
      width: 128px !important;
      height: 96px !important;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icare_logo.png" alt="iCare" style="width:160px;height:160px;object-fit:contain;">
    <div class="spinner"></div>
  </div>
  <!-- Agora Web SDK -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });

    // ── Agora Web helpers called from Flutter via JS interop ──────────────
    var _agoraClient = null;
    var _localAudioTrack = null;
    var _localVideoTrack = null;

    window.agoraJoin = async function(appId, channel, token, uid, audioOnly) {
      try {
        // Suppress Agora telemetry CORS errors
        AgoraRTC.setLogLevel(4);
        try { AgoraRTC.disableLogUpload(); } catch(_) {}
        // Clean up any stale previous session so mic/cam aren't "in use"
        if (_localAudioTrack) { try { _localAudioTrack.stop(); _localAudioTrack.close(); } catch(_){} _localAudioTrack = null; }
        if (_localVideoTrack) { try { _localVideoTrack.stop(); _localVideoTrack.close(); } catch(_){} _localVideoTrack = null; }
        if (_agoraClient) { try { await _agoraClient.leave(); } catch(_){} _agoraClient = null; }

        _agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
        window._agoraRemoteJoined = false; // reset on each new call
        window._agoraRemoteLeft = false;

        // ── Helper: play remote video with retry until div is in DOM ──────
        async function playRemoteVideo(videoTrack, retries) {
          retries = retries || 0;
          var remoteDiv = document.getElementById('agora-remote');
          if (remoteDiv) {
            try {
              // Clear any previous video before playing new one
              videoTrack.play('agora-remote');
              console.log('✅ Remote video playing (attempt ' + retries + ')');
            } catch(e) {
              console.warn('Remote video play error:', e.message);
              if (retries < 5) {
                setTimeout(function() { playRemoteVideo(videoTrack, retries + 1); }, 300);
              }
            }
          } else {
            // Div not ready yet — retry up to 20 times (6 seconds total)
            if (retries < 20) {
              console.warn('agora-remote div not found, retry ' + retries);
              setTimeout(function() { playRemoteVideo(videoTrack, retries + 1); }, 300);
            } else {
              console.error('agora-remote div never appeared after retries');
            }
          }
        }

        _agoraClient.on('user-left', (user) => {
          window._agoraRemoteLeft = true;
          console.log('📞 Remote user left the call');
        });

        _agoraClient.on('user-published', async (user, mediaType) => {
          window._agoraRemoteJoined = true;
          await _agoraClient.subscribe(user, mediaType);
          if (mediaType === 'video') {
            playRemoteVideo(user.videoTrack, 0);
          }
          if (mediaType === 'audio') {
            try { user.audioTrack.play(); } catch(e) { console.warn('Audio play error:', e); }
          }
        });

        _agoraClient.on('user-unpublished', (user, mediaType) => {
          if (mediaType === 'video') {
            var remoteDiv = document.getElementById('agora-remote');
            if (remoteDiv) remoteDiv.innerHTML = '';
          }
        });

        // ── Handle users who joined BEFORE us ─────────────────────────────
        _agoraClient.on('user-joined', async (user) => {
          window._agoraRemoteJoined = true;
          // If remote user is already publishing, subscribe immediately
          if (user.hasVideo) {
            try {
              await _agoraClient.subscribe(user, 'video');
              playRemoteVideo(user.videoTrack, 0);
            } catch(e) { console.warn('user-joined video subscribe error:', e); }
          }
          if (user.hasAudio) {
            try {
              await _agoraClient.subscribe(user, 'audio');
              user.audioTrack.play();
            } catch(e) { console.warn('user-joined audio subscribe error:', e); }
          }
        });

        await _agoraClient.join(appId, channel, token, uid || null);

        // ── Subscribe to any users already in channel ──────────────────────
        var remoteUsers = _agoraClient.remoteUsers;
        for (var i = 0; i < remoteUsers.length; i++) {
          var remoteUser = remoteUsers[i];
          if (remoteUser.hasVideo) {
            try {
              await _agoraClient.subscribe(remoteUser, 'video');
              playRemoteVideo(remoteUser.videoTrack, 0);
            } catch(e) { console.warn('Pre-existing user video error:', e); }
          }
          if (remoteUser.hasAudio) {
            try {
              await _agoraClient.subscribe(remoteUser, 'audio');
              remoteUser.audioTrack.play();
            } catch(e) { console.warn('Pre-existing user audio error:', e); }
          }
        }

        // Always try mic
        try {
          _localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        } catch(micErr) {
          console.warn('Mic not available:', micErr.message, '— joining without mic');
          _localAudioTrack = null;
        }

        // Only create camera track when NOT audio-only
        if (!audioOnly) {
          try {
            _localVideoTrack = await AgoraRTC.createCameraVideoTrack();
          } catch(camErr) {
            console.warn('Camera not available:', camErr.message, '— joining without camera');
            _localVideoTrack = null;
          }
        } else {
          console.log('📞 Audio-only call — camera disabled');
          _localVideoTrack = null;
        }

        var tracks = [];
        if (_localAudioTrack) tracks.push(_localAudioTrack);
        if (_localVideoTrack) tracks.push(_localVideoTrack);
        if (tracks.length > 0) await _agoraClient.publish(tracks);
        if (_localVideoTrack) _localVideoTrack.play('agora-local');

        return 'ok';
      } catch(e) {
        console.warn('agoraJoin non-fatal error:', e.message || String(e));
        // Never block the user — return ok so Flutter shows the call screen
        return 'ok';
      }
    };

    window.agoraLeave = async function() {
      try {
        if (_localAudioTrack) { _localAudioTrack.stop(); _localAudioTrack.close(); }
        if (_localVideoTrack) { _localVideoTrack.stop(); _localVideoTrack.close(); }
        if (_agoraClient) await _agoraClient.leave();
        _agoraClient = null; _localAudioTrack = null; _localVideoTrack = null;
      } catch(e) { console.error('agoraLeave error:', e); }
    };

    // Returns number of remote users currently in the Agora channel
    window.agoraGetRemoteUserCount = function() {
      try { return _agoraClient ? _agoraClient.remoteUsers.length : 0; } catch(e) { return 0; }
    };

    // Returns true if a remote user has joined this call session
    window.agoraIsRemoteJoined = function() {
      return window._agoraRemoteJoined === true || (window.agoraGetRemoteUserCount() > 0);
    };

    // Returns true if the remote user LEFT mid-call (e.g. doctor converted to video)
    window.agoraIsRemoteLeft = function() {
      return window._agoraRemoteLeft === true && window.agoraGetRemoteUserCount() === 0;
    };

    window.agoraMuteMic = function(mute) {
      if (_localAudioTrack) {
        try {
          // setMuted keeps track published — no republication, no video freeze
          _localAudioTrack.setMuted(mute);
        } catch(e) {
          try { _localAudioTrack.setEnabled(!mute); } catch(_) {}
        }
      }
    };

    window.agoraMuteCam = function(mute) {
      if (_localVideoTrack) {
        try {
          _localVideoTrack.setMuted(mute);
        } catch(e) {
          try { _localVideoTrack.setEnabled(!mute); } catch(_) {}
        }
      }
    };

    // ── Ringtone (Web Audio API — no external file needed) ────────────────
    var _ringtoneInterval = null;
    var _ringtoneCtx = null;

    window.playRingtone = function() {
      try {
        if (_ringtoneInterval) return;
        _ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();

        function ringOnce() {
          if (!_ringtoneCtx) return;
          // Two-tone phone ring: 480 Hz + 440 Hz
          [480, 440].forEach(function(freq, i) {
            var osc = _ringtoneCtx.createOscillator();
            var gain = _ringtoneCtx.createGain();
            osc.connect(gain);
            gain.connect(_ringtoneCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0, _ringtoneCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, _ringtoneCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.25, _ringtoneCtx.currentTime + 0.35);
            gain.gain.linearRampToValueAtTime(0, _ringtoneCtx.currentTime + 0.5);
            osc.start(_ringtoneCtx.currentTime);
            osc.stop(_ringtoneCtx.currentTime + 0.5);
          });
        }

        ringOnce();
        _ringtoneInterval = setInterval(ringOnce, 2000);
      } catch(e) {
        console.warn('Ringtone error:', e);
      }
    };

    window.stopRingtone = function() {
      try {
        if (_ringtoneInterval) { clearInterval(_ringtoneInterval); _ringtoneInterval = null; }
        if (_ringtoneCtx) { _ringtoneCtx.close(); _ringtoneCtx = null; }
      } catch(_) {}
    };

    // ── Water Reminder Notifications ─────────────────────────────────────────
    var _waterReminderTimer = null;

    // Called from Dart after permission is already granted
    window.scheduleWaterReminderInterval = function(intervalMinutes) {
      try {
        if (_waterReminderTimer) { clearInterval(_waterReminderTimer); _waterReminderTimer = null; }
        var ms = intervalMinutes * 60 * 1000;
        _waterReminderTimer = setInterval(function() {
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              new Notification('Drink Water 💧', {
                body: 'Time to drink a glass of water! Stay hydrated.',
                icon: '/icons/Icon-192.png',
              });
            }
            // In-app banner event
            window.dispatchEvent(new CustomEvent('icare-reminder', {
              detail: JSON.stringify({ type: 'water', title: 'Drink Water 💧', body: 'Time to drink a glass of water! Stay hydrated.' })
            }));
          } catch(e) { console.warn('Water notification error:', e); }
        }, ms);
        console.log('Water reminder scheduled every', intervalMinutes, 'minutes');
      } catch(e) { console.warn('scheduleWaterReminderInterval error:', e); }
    };

    window.cancelWaterReminder = function() {
      if (_waterReminderTimer) { clearInterval(_waterReminderTimer); _waterReminderTimer = null; }
    };

    // ── Generic Daily Reminder Notifications (medication, health check, etc.) ──
    var _dailyReminderTimers = {};

    // Schedule a reminder to fire daily at hour:minute.
    // Also dispatches icare-reminder CustomEvent for in-app banner.
    window.scheduleDailyReminder = function(type, title, body, hour, minute) {
      try {
        // Cancel any previous timers for this type
        if (_dailyReminderTimers[type + '_t']) clearTimeout(_dailyReminderTimers[type + '_t']);
        if (_dailyReminderTimers[type + '_i']) clearInterval(_dailyReminderTimers[type + '_i']);

        function fire() {
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              new Notification(title, { body: body, icon: '/icons/Icon-192.png' });
            }
            window.dispatchEvent(new CustomEvent('icare-reminder', {
              detail: JSON.stringify({ type: type, title: title, body: body })
            }));
          } catch(e) { console.warn('Daily reminder fire error:', e); }
        }

        var now  = new Date();
        var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 1);
        var delay = next - now;

        _dailyReminderTimers[type + '_t'] = setTimeout(function() {
          fire();
          _dailyReminderTimers[type + '_i'] = setInterval(fire, 24 * 60 * 60 * 1000);
        }, delay);

        console.log('Daily reminder scheduled:', type, 'at',
          (hour < 10 ? '0' : '') + hour + ':' + (minute < 10 ? '0' : '') + minute,
          '— fires in', Math.round(delay / 60000), 'min');
      } catch(e) { console.warn('scheduleDailyReminder error:', e); }
    };

    window.cancelDailyReminder = function(type) {
      try {
        if (_dailyReminderTimers[type + '_t']) { clearTimeout(_dailyReminderTimers[type + '_t']); delete _dailyReminderTimers[type + '_t']; }
        if (_dailyReminderTimers[type + '_i']) { clearInterval(_dailyReminderTimers[type + '_i']); delete _dailyReminderTimers[type + '_i']; }
        console.log('Daily reminder cancelled:', type);
      } catch(e) {}
    };
  </script>
  <script>
    // Kill any previously registered Flutter service worker — it serves stale
    // main.dart.js from cache, causing old app code to run after deploys.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      }).catch(function(){});
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        }).catch(function(){});
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- LMS Live Session — Agora RTC + MediaRecorder -->
  <script>
    window._lmsAgoraClient = null;
    window._lmsLocalAudio = null;
    window._lmsLocalVideo = null;
    window._lmsRecorder = null;
    window._lmsChunks = [];
    window._lmsStream = null;

    // Raise Flutter glass pane above video so Flutter buttons work
    window.lmsRaiseFlutterLayer = function() {
      document.querySelectorAll('flt-glass-pane,flt-text-editing-host').forEach(function(el) {
        el.style.zIndex = '99999';
      });
    };

    // ── LMS Agora Video (no login, no branding) ───────────────────────────────

    // ── _lmsEnsureMediaPublished — THE single entry point for mic/cam activation ──
    // Idempotent + busy-locked: safe to call from join, the overlay tap, or legacy
    // code paths (even stale cached builds) without ever double-creating or
    // double-publishing tracks. Mirrors the working doctor/patient agoraJoin flow.
    window._lmsMediaBusy = false;
    window._lmsEnsureMediaPublished = async function() {
      if (window._lmsMediaBusy) {
        console.log('LMS media: another call in progress — skipping duplicate');
        return 'busy';
      }
      window._lmsMediaBusy = true;
      try {
        // 1. Wait up to 8s for Agora client to be CONNECTED
        var _waitMs = 0;
        while (_waitMs < 8000) {
          if (window._lmsAgoraClient && window._lmsAgoraClient.connectionState === 'CONNECTED') break;
          await new Promise(function(r) { setTimeout(r, 200); });
          _waitMs += 200;
        }
        if (!window._lmsAgoraClient || window._lmsAgoraClient.connectionState !== 'CONNECTED') {
          console.error('LMS media: Agora not connected after 8s, state=',
            window._lmsAgoraClient ? window._lmsAgoraClient.connectionState : 'no_client');
          return 'not_connected';
        }

        // 2. Create tracks only if missing.
        //    speech_standard + AEC/ANS/AGC = clear low-latency voice (no echo, no noise).
        //    480p motion-optimized video = lower bandwidth → smaller jitter buffer → less delay.
        if (!window._lmsLocalAudio) {
          try {
            window._lmsLocalAudio = await AgoraRTC.createMicrophoneAudioTrack({
              encoderConfig: 'speech_standard',
              AEC: true, ANS: true, AGC: true
            });
            console.log('LMS media: mic track created');
          } catch(e) { console.error('LMS media: mic track error:', e.message); }
        }
        if (!window._lmsLocalVideo) {
          try {
            window._lmsLocalVideo = await AgoraRTC.createCameraVideoTrack({
              encoderConfig: '720p_3',
              optimizationMode: 'motion'
            });
            console.log('LMS media: camera track created');
          } catch(e) { console.warn('LMS media: camera error:', e.message); }
        }
        if (window._lmsLocalAudio) {
          try { await window._lmsLocalAudio.setEnabled(true); } catch(_) {}
          try { window._lmsLocalAudio.setMuted(false); } catch(_) {}
        }

        // 3. Publish ONLY tracks not already published (client.localTracks = published)
        // Client may have been nulled by lmsAgoraLeave while we awaited — re-check
        if (!window._lmsAgoraClient) { console.warn('LMS media: client gone (left channel?)'); return 'no_client'; }
        var already = window._lmsAgoraClient.localTracks || [];
        var toPublish = [];
        if (window._lmsLocalAudio && already.indexOf(window._lmsLocalAudio) === -1) toPublish.push(window._lmsLocalAudio);
        if (window._lmsLocalVideo && already.indexOf(window._lmsLocalVideo) === -1) toPublish.push(window._lmsLocalVideo);
        if (toPublish.length > 0) {
          try {
            await window._lmsAgoraClient.publish(toPublish);
            console.log('LMS media: published', toPublish.length, 'track(s)');
          } catch(pubErr) {
            console.warn('LMS media: publish error:', pubErr.message);
          }
        } else {
          console.log('LMS media: all tracks already published');
        }

        // 4. Resume/play all remote audio + video (unblocks autoplay)
        if (!window._lmsAgoraClient) return 'no_client';
        window._lmsAgoraClient.remoteUsers.forEach(function(u) {
          if (u.audioTrack) {
            try {
              u.audioTrack.setVolume(100);
              u.audioTrack.play();
              console.log('LMS media: remote audio playing uid', u.uid);
            } catch(e) { console.warn('LMS media: remote audio play error:', e.message); }
          }
          // Skip video if lmsPlayIntoTile is already mid-play for this uid
          // (e.g. this is a late-joiner and the "subscribe to anyone already
          // in channel" loop just started playing it moments ago) — clearing
          // and re-playing the same div here would race that in-flight play
          // and could leave the tile transiently blank.
          if (u.videoTrack && !(window._lmsPlayInFlight && window._lmsPlayInFlight[u.uid])) {
            try {
              var vd = document.getElementById('lms-tile-' + u.uid + '-video');
              if (!vd) { window._lmsGetOrCreateTile(u.uid); vd = document.getElementById('lms-tile-' + u.uid + '-video'); }
              if (vd) { vd.innerHTML = ''; u.videoTrack.play(vd.id, { fit: window._lmsVideoFit || 'cover' }); }
            } catch(_) {}
          }
        });

        // 4b. Audio diagnostics — log mic + remote levels every 2s for 60s.
        // local level ~0.00 while speaking = mic not capturing (device/OS issue)
        // remote level ~0.00 while other side speaks = audio not arriving
        try {
          if (window._lmsLocalAudio && window._lmsLocalAudio.getTrackLabel) {
            console.log('LMS media: using microphone =', window._lmsLocalAudio.getTrackLabel());
          }
        } catch(_) {}
        if (window._lmsVolTimer) clearInterval(window._lmsVolTimer);
        var _volTicks = 0;
        window._lmsVolTimer = setInterval(function() {
          _volTicks++;
          try {
            var lv = (window._lmsLocalAudio && window._lmsLocalAudio.getVolumeLevel)
              ? window._lmsLocalAudio.getVolumeLevel().toFixed(2) : 'none';
            var lm = window._lmsLocalAudio ? window._lmsLocalAudio.muted : '-';
            var rems = window._lmsAgoraClient ? window._lmsAgoraClient.remoteUsers.map(function(u) {
              return u.uid + '=' + (u.audioTrack && u.audioTrack.getVolumeLevel
                ? u.audioTrack.getVolumeLevel().toFixed(2) : 'no-audio');
            }).join(', ') : 'no-client';
            console.log('🎙️ LMS audio check #' + _volTicks +
              ' | my mic level=' + lv + ' muted=' + lm + ' | incoming: ' + (rems || 'nobody'));

    // below MUST pass { fit: window._lmsVideoFit } — omitting it makes Agora
    // default to 'cover', silently discarding the user's "Fit" selection on
    // every fullscreen toggle (this was the one call site missing it).
    window.lmsRefreshVideoLayout = function() {
      try {
        var ld = document.getElementById('lms-agora-local');
        if (ld) {
          if (window._lmsScreenSharing && window._lmsScreenTrack) {
            try { ld.innerHTML = ''; window._lmsScreenTrack.play('lms-agora-local', { fit: window._lmsVideoFit || 'cover' }); } catch(_) {}
          } else if (window._lmsLocalVideo) {
            try { ld.innerHTML = ''; window._lmsLocalVideo.play('lms-agora-local', { fit: window._lmsVideoFit || 'cover' }); } catch(_) {}
          }
        }
        if (window._lmsAgoraClient) {
          window._lmsAgoraClient.remoteUsers.forEach(function(u) {
            if (u.videoTrack) {
              var vd = document.getElementById('lms-tile-' + u.uid + '-video');
              if (!vd) { window._lmsGetOrCreateTile(u.uid); vd = document.getElementById('lms-tile-' + u.uid + '-video'); }
              if (vd) { try { vd.innerHTML = ''; u.videoTrack.play(vd.id, { fit: window._lmsVideoFit || 'cover' }); } catch(_) {} }
            }
          });
        }
      } catch(e) { console.warn('lmsRefreshVideoLayout error:', e); }
    };

    // Composite recording: instructor (right) + student (left) side-by-side on canvas
    window.lmsStartRecording = async function() {
      try {
        if (window._lmsRecorder && window._lmsRecorder.state === 'recording') return;

        // ── Build hidden video elements from Agora tracks ───────────────
        // Elements MUST be in the DOM for browser hardware decoding to activate
        var _hiddenStyle = function(el) {
          el.style.position = 'fixed';
          el.style.top = '-9999px'; el.style.left = '-9999px';
          el.style.width = '2px'; el.style.height = '2px';
          el.style.opacity = '0'; el.style.pointerEvents = 'none';
        };

        var localVid = document.createElement('video');
        localVid.autoplay = true; localVid.muted = true; localVid.playsInline = true;
        _hiddenStyle(localVid);
        document.body.appendChild(localVid);

        // Bind the recording's local video element to whichever track is the
        // instructor's active local video — screen track while sharing, camera
        // otherwise. Exposed so lmsToggleScreenShare can re-bind on switch.
        window._lmsRebindRecordLocal = function() {
          var srcTrack = (window._lmsScreenSharing && window._lmsScreenTrack)
            ? window._lmsScreenTrack
            : window._lmsLocalVideo;
          if (!srcTrack || !localVid) return;
          try {
            var s = new MediaStream();
            s.addTrack(srcTrack.getMediaStreamTrack());
            localVid.srcObject = s;
            localVid.play().catch(function(){});
          } catch(_) {}
        };
        window._lmsRebindRecordLocal();

        var remoteVid = null;
        var remoteUsers = window._lmsAgoraClient ? window._lmsAgoraClient.remoteUsers : [];
        if (remoteUsers.length > 0 && remoteUsers[0].videoTrack) {
          remoteVid = document.createElement('video');
          remoteVid.autoplay = true; remoteVid.muted = true; remoteVid.playsInline = true;
          _hiddenStyle(remoteVid);
          var rs = new MediaStream();
          try { rs.addTrack(remoteUsers[0].videoTrack.getMediaStreamTrack()); } catch(_) {}
          remoteVid.srcObject = rs;
          document.body.appendChild(remoteVid);
          remoteVid.play().catch(function(){});
        }
        localVid.play().catch(function(){});

        // ── Canvas composite ─────────────────────────────────────────────
        // 1080p so shared screen content (text/slides) stays legible.
        var W = 1920, H = 1080;
        var canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        var ctx = canvas.getContext('2d');
        window._lmsRecordCanvas = canvas;
        window._lmsRecordLocalVid = localVid;
        window._lmsRecordRemoteVid = remoteVid;

        // Draw a source video into a target rect preserving aspect ratio
        // (letterboxed) so screen content is never stretched/squeezed.
        var drawFit = function(vid, dx, dy, dw, dh) {
          var vw = vid.videoWidth, vh = vid.videoHeight;
          if (!vw || !vh) return;
          var scale = Math.min(dw / vw, dh / vh);
          var w = vw * scale, h = vh * scale;
          ctx.drawImage(vid, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h);
        };

        var drawFrame = function() {
          if (!window._lmsRecorder || window._lmsRecorder.state !== 'recording') return;
          ctx.fillStyle = '#111';
          ctx.fillRect(0, 0, W, H);
          var hasRemote = remoteVid && remoteVid.readyState >= 2 && remoteVid.videoWidth > 0;
          var hasLocal  = localVid  && localVid.readyState  >= 2 && localVid.videoWidth  > 0;
          if (window._lmsScreenSharing && hasLocal) {
            // Screen share: fill the whole frame with the shared screen
            // (aspect-preserved), camera goes to a small PiP corner.
            drawFit(localVid, 0, 0, W, H);
            if (hasRemote) {
              var pipW = W * 0.22, pipH = pipW * 9 / 16;
              ctx.fillStyle = '#000';
              ctx.fillRect(W - pipW - 12, H - pipH - 12, pipW, pipH);
              drawFit(remoteVid, W - pipW - 12, H - pipH - 12, pipW, pipH);
            }
          } else if (hasRemote && hasLocal) {
            drawFit(remoteVid, 0,   0, W/2, H);   // student  — left
            drawFit(localVid,  W/2, 0, W/2, H);   // instructor — right
          } else if (hasLocal) {
            drawFit(localVid, 0, 0, W, H);
          } else if (hasRemote) {
            drawFit(remoteVid, 0, 0, W, H);
          }
        };
        // Start drawing after delay — DOM-attached video needs time to decode first frame.
        // Uses setInterval (not requestAnimationFrame) because browsers throttle/
        // pause rAF entirely when the tab is backgrounded or minimized — which is
        // exactly when instructors tend to switch away during a live session —
        // causing the recording to drop frames and look choppy. setInterval is
        // only clamped to a minimum delay in background tabs, so it keeps drawing
        // at a steady (if occasionally slightly slower) rate instead of stalling.
        setTimeout(function() {
          window._lmsRecordDrawTimer = setInterval(drawFrame, 1000 / 30);
        }, 1500);

        // ── MediaRecorder from canvas stream + mixed audio ───────────────
        // 30fps for smooth motion; matches Agora screen-share frameRate.
        var canvasStream = canvas.captureStream(30);

        // Mix local mic + all remote audio tracks via Web Audio API
        try {
          var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          // Resume in case browser suspended the context (autoplay policy) —
          // MUST be awaited: connecting sources before the context is truly
          // 'running' produces a silent destination track (recording plays
          // back with no sound even though a track exists).
          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch(_) {}
          }
          // If the mic track isn't ready yet (race with Agora publish flow,
          // e.g. recording auto-starts 3s after join), wait briefly and retry
          // instead of silently recording with no local audio at all.
          if (!window._lmsLocalAudio) {
            for (var waitTry = 0; waitTry < 10 && !window._lmsLocalAudio; waitTry++) {
              await new Promise(function(r) { setTimeout(r, 300); });
            }
          }
          var dest = audioCtx.createMediaStreamDestination();
          var audioSourceCount = 0;
          if (window._lmsLocalAudio) {
            try {
              var localStream = new MediaStream([window._lmsLocalAudio.getMediaStreamTrack()]);
              audioCtx.createMediaStreamSource(localStream).connect(dest);
              audioSourceCount++;
            } catch(ae) { console.warn('LMS rec: local audio mix error:', ae.message); }
          } else {
            console.warn('LMS rec: local mic track still unavailable after wait — recording will have no local audio');
          }
          if (window._lmsAgoraClient) {
            window._lmsAgoraClient.remoteUsers.forEach(function(u) {
              if (u.audioTrack) {
                try {
                  var remStream = new MediaStream([u.audioTrack.getMediaStreamTrack()]);
                  audioCtx.createMediaStreamSource(remStream).connect(dest);
                  audioSourceCount++;
                } catch(re) { console.warn('LMS rec: remote audio mix error:', re.message); }
              }
            });
          }
          var mixedTrack = dest.stream.getAudioTracks()[0];
          if (mixedTrack) {
            canvasStream.addTrack(mixedTrack);
            console.log('LMS: mixed ' + audioSourceCount + ' audio source(s) into recording, audioCtx.state=' + audioCtx.state);
          } else {
            console.warn('LMS rec: no mixed audio track produced — recording will be silent');
          }
          // Keep a handle so we can verify/resume if the context gets
          // suspended again mid-recording (some browsers do this on tab blur).
          window._lmsRecordAudioCtx = audioCtx;
        } catch(audioErr) {
          // Fallback: local only
          if (window._lmsLocalAudio) {
            try { canvasStream.addTrack(window._lmsLocalAudio.getMediaStreamTrack()); } catch(_) {}
          }
          console.warn('LMS rec: audio mix failed, falling back to local only:', audioErr.message);
        }

        // Fallback: if canvas captureStream not supported, record tracks directly
        if (!canvas.captureStream) {
          canvasStream = new MediaStream();
          if (window._lmsLocalAudio) { try { canvasStream.addTrack(window._lmsLocalAudio.getMediaStreamTrack()); } catch(_) {} }
          if (window._lmsLocalVideo) { try { canvasStream.addTrack(window._lmsLocalVideo.getMediaStreamTrack()); } catch(_) {} }
        }

        window._lmsChunks = [];
        // Include opus audio codec so MediaRecorder captures audio alongside video
        var mimeType = [
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/webm;codecs=h264,opus',
          'video/webm;codecs=vp9',
          'video/webm;codecs=vp8',
          'video/webm'
        ].find(function(t) { return MediaRecorder.isTypeSupported(t); }) || 'video/webm';

        // 4 Mbps @ 1080p keeps shared-screen text crisp without huge files.
        window._lmsRecorder = new MediaRecorder(canvasStream, { mimeType: mimeType, videoBitsPerSecond: 4000000, audioBitsPerSecond: 128000 });
        window._lmsRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) window._lmsChunks.push(e.data);
        };
        window._lmsRecorder.start(5000);
        console.log('LMS: composite recording started (canvas ' + W + 'x' + H + ')');
      } catch(e) {
        console.warn('LMS: recording unavailable:', e.message);
      }
    };

    // Stop recording → upload to Cloudinary via signed backend endpoint → save URL in LMS
    window.lmsStopRecordingAndUpload = function(sessionId, backendUrl, authToken) {
      if (!window._lmsRecorder) return;

      var doSave = async function() {
        // Clean up canvas recording helpers
        if (window._lmsRecordDrawTimer) { clearInterval(window._lmsRecordDrawTimer); window._lmsRecordDrawTimer = null; }
        if (window._lmsRecordLocalVid) { try { window._lmsRecordLocalVid.pause(); window._lmsRecordLocalVid.srcObject = null; if (window._lmsRecordLocalVid.parentNode) window._lmsRecordLocalVid.parentNode.removeChild(window._lmsRecordLocalVid); } catch(_){} window._lmsRecordLocalVid = null; }
        if (window._lmsRecordRemoteVid) { try { window._lmsRecordRemoteVid.pause(); window._lmsRecordRemoteVid.srcObject = null; if (window._lmsRecordRemoteVid.parentNode) window._lmsRecordRemoteVid.parentNode.removeChild(window._lmsRecordRemoteVid); } catch(_){} window._lmsRecordRemoteVid = null; }
        window._lmsRecordCanvas = null;
        window._lmsRebindRecordLocal = null;
        if (window._lmsRecordAudioCtx) {
          try { window._lmsRecordAudioCtx.close(); } catch(_) {}
          window._lmsRecordAudioCtx = null;
        }
        if (window._lmsStream) {
          window._lmsStream.getTracks().forEach(function(t) { t.stop(); });
          window._lmsStream = null;
        }
        var blob = new Blob(window._lmsChunks, { type: 'video/webm' });
        window._lmsChunks = [];

        if (blob.size < 5000) { console.log('LMS: recording too short, skipping save'); return; }

        var sizeMB = (blob.size / 1048576).toFixed(1);
        console.log('LMS: uploading session recording (' + sizeMB + ' MB) to LMS...');

        try {
          // Step 1: get a signed upload token from the backend
          var signResp = await fetch(
            backendUrl + '/upload/sign?folder=icare%2Flms-recordings&resource_type=video',
            { headers: { 'Authorization': 'Bearer ' + authToken } }
          );
          var sign = await signResp.json();

          if (!sign.success || !sign.cloud_name) {
            console.warn('LMS: could not get Cloudinary signature:', sign);
            return;
          }

          // Step 2: upload blob directly to Cloudinary (signed — bypasses Vercel 4.5 MB limit)
          var fd = new FormData();
          var recTs = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
          fd.append('file', blob, 'icare-session-' + sessionId + '-' + recTs + '.webm');
          fd.append('api_key', sign.api_key);
          fd.append('timestamp', String(sign.timestamp));
          fd.append('signature', sign.signature);
          fd.append('folder', sign.folder);

          var uploadResp = await fetch(
            'https://api.cloudinary.com/v1_1/' + sign.cloud_name + '/video/upload',
            { method: 'POST', body: fd }
          );
          var data = await uploadResp.json();

          if (!data.secure_url) {
            console.warn('LMS: Cloudinary upload error:', data.error || data);
            return;
          }

          // Step 3: save the URL to the live session document in MongoDB
          var patchResp = await fetch(backendUrl + '/live-sessions/' + sessionId + '/set-recording-url', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
            body: JSON.stringify({ recordingUrl: data.secure_url }),
          });
          var patchData = await patchResp.json();
          console.log('LMS: recording saved to LMS:', data.secure_url);
          // Notify Flutter so the session list can refresh and show the ▶ REC badge
          if (window._lmsRecordingSavedCallback) {
            try { window._lmsRecordingSavedCallback(data.secure_url); } catch(_) {}
          }
        } catch(e) {
          console.warn('LMS: upload failed:', e.message);
        }
      };

      if (window._lmsRecorder.state === 'recording') {
        window._lmsRecorder.onstop = doSave;
        window._lmsRecorder.stop();
      } else {
        doSave();
      }
    };
  </script>

</body>
</html>
